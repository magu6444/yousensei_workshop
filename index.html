  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #FAFAFC;
      color: #111111;
      font-family: 'Noto Sans', 'Noto Sans JP', sans-serif;
      overflow-x: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* タイトル画面ポスター */
    .intro-poster {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 100vh;
      background: #FFFFFF;
      padding: 1.25rem 1.25rem 2.5rem 1.25rem;
      letter-spacing: -0.02em;
    }

    .poster-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      line-height: 1.0;
    }

    .poster-char {
      font-weight: 900 !important;
      font-size: 13.5vw;
      color: #111111;
      font-family: 'Noto Sans', 'Noto Sans JP', sans-serif;
      font-style: normal;
      display: inline-block;
      text-align: center;
      width: 1.2em;
    }

    @media (min-width: 500px) {
      .poster-char {
        font-size: 4.2rem;
      }
    }

    .poster-emoji {
      font-size: 11.5vw;
      line-height: 1;
      transform: scale(1.1);
      display: inline-block;
      text-align: center;
      width: 1.2em;
    }

    @media (min-width: 500px) {
      .poster-emoji {
        font-size: 3.6rem;
      }
    }

    /* 新聞スタック */
    .newspaper-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      padding-top: 6px;
      padding-bottom: 30px;
      width: 100%;
    }

    .newspaper-card {
      width: 100%;
      background: #FFFFFF;
      border: 1px solid #EBEBEF;
      margin-top: -20px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      border-radius: 1rem;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.03);
    }

    .newspaper-card:first-child {
      margin-top: 0;
    }

    .newspaper-card:active,
    .newspaper-card:hover {
      transform: translateY(-6px);
      z-index: 40 !important;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.08);
    }

    /* カスタムスライダー */
    input[type=range] {
      -webkit-appearance: none;
      background: #EBEBEF;
      height: 4px;
      border-radius: 2px;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 18px;
      width: 18px;
      border-radius: 50%;
      background: #111111;
      cursor: pointer;
    }

    .fade-in {
      animation: fadeIn 0.3s ease forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

        try {

        } catch (e) {
          console.error(e);

      playSubtleClick() {
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          const ctx = new AudioCtx();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, ctx.currentTime);
          gain.gain.setValueAtTime(0.04, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.03);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.03);

    // --- 感情パラメータ対応「5角形変形・トゲトゲ・パンク」顔輪郭描画 ---
    function drawMinimalDistortedFace(canvas, vibesData, showMetrics = true) {
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const width = canvas.width;
      const height = canvas.height;
      const cx = width / 2;
      const cy = height / 2;

      ctx.clearRect(0, 0, width, height);

      // 白背景
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, width, height);

      // 同心円レーダー枠
      const radiusMax = width * 0.36;
      ctx.strokeStyle = '#EBEBEF';
      ctx.lineWidth = 1;
      [0.25, 0.5, 0.75, 1.0].forEach(r => {
        ctx.beginPath();
        ctx.arc(cx, cy, radiusMax * r, 0, Math.PI * 2);
        ctx.stroke();
      });

      // 5軸の角度（上、右上、右下、左下、左上）
      const angles = [
        -Math.PI / 2,                          // 上: いらいら
        -Math.PI / 2 + (Math.PI * 2 / 5),       // 右上: 理不尽
        -Math.PI / 2 + (Math.PI * 4 / 5),       // 右下: 虚無
        -Math.PI / 2 + (Math.PI * 6 / 5),       // 左下: 嫉妬
        -Math.PI / 2 + (Math.PI * 8 / 5)        // 左上: 悲しい
      ];

      ctx.strokeStyle = '#F0F0F4';
      angles.forEach(a => {
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(a) * radiusMax, cy + Math.sin(a) * radiusMax);
        ctx.stroke();
      });

      const anger = (vibesData.anger || 50) / 100;
      const sadness = (vibesData.sadness || 50) / 100;
      const unfairness = (vibesData.unfairness || 50) / 100;
      const envy = (vibesData.envy || 50) / 100;
      const voidVal = (vibesData.void || 50) / 100;

      const vibeValues = [anger, unfairness, voidVal, envy, sadness];

      // --- パラメータ値に対応する「5角形変形・トゲトゲ・パンク」顔輪郭描画 ---
      ctx.beginPath();
      const numPoints = 15; // 頂点数を増やして5角形から角・トゲが生えたパンク状にする
      for (let i = 0; i < numPoints; i++) {
        const theta = (i / numPoints) * Math.PI * 2 - Math.PI / 2;
        // 5つの軸に対する影響を補間計算
        const sector = (theta + Math.PI / 2 + Math.PI * 2) % (Math.PI * 2);
        const sectorIdx = Math.floor(sector / (Math.PI * 2 / 5)) % 5;
        const nextSectorIdx = (sectorIdx + 1) % 5;
        const ratio = (sector % (Math.PI * 2 / 5)) / (Math.PI * 2 / 5);

        // 各軸の強度から頂点の膨張・角張りを決定
        const currentVibe = vibeValues[sectorIdx];
        const nextVibe = vibeValues[nextSectorIdx];
        const interpolatedVibe = currentVibe * (1 - ratio) + nextVibe * ratio;

        // トゲトゲ・パンク変形（奇数インデックスで少し引っ込んで星型・角張り・膨張）
        let spike = (i % 3 === 0) ? (1 + interpolatedVibe * 0.4) : (0.85 + interpolatedVibe * 0.2);
        let r = (width * 0.18) + (radiusMax * 0.55 * interpolatedVibe * spike);

        const px = cx + Math.cos(theta) * r;
        const py = cy + Math.sin(theta) * r;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fillStyle = '#FAFAFA';
      ctx.fill();
      ctx.strokeStyle = '#111111';
      ctx.lineWidth = 2;
      ctx.stroke();

      // 目・鼻・口を描画
      const eyeDroop = sadness * 10;
      const eyeStretchX = envy * 12;
      const mouthContort = (anger * 14) - (voidVal * 10);
      const headR = width * 0.2;

      // 左目
      ctx.save();
      ctx.translate(cx - headR * 0.4 - eyeStretchX / 2, cy - headR * 0.15 + eyeDroop);
      ctx.rotate((sadness - anger) * 0.3);
      ctx.beginPath();
      ctx.ellipse(0, 0, Math.max(3.5, 9 + eyeStretchX * 0.5), Math.max(2, 5 + anger * 5), 0, 0, Math.PI * 2);
      ctx.fillStyle = '#111111'; ctx.fill();
      ctx.beginPath();
      ctx.arc((envy - 0.5) * 4, (unfairness - 0.5) * 3, 2, 0, Math.PI * 2);
      ctx.fillStyle = '#FFFFFF'; ctx.fill();
      ctx.restore();

      // 右目
      ctx.save();
      ctx.translate(cx + headR * 0.38 + eyeStretchX / 3, cy - headR * 0.15 - eyeDroop / 2);
      ctx.rotate((anger - sadness) * 0.35);
      ctx.beginPath();
      ctx.ellipse(0, 0, Math.max(3.5, 8.5 + anger * 8), Math.max(2, 5.5 + sadness * 4.5), 0.12, 0, Math.PI * 2);
      ctx.fillStyle = '#111111'; ctx.fill();
      ctx.beginPath();
      ctx.arc((0.5 - envy) * 4, (0.5 - anger) * 4, 2, 0, Math.PI * 2);
      ctx.fillStyle = '#FFFFFF'; ctx.fill();
      ctx.restore();

      // 鼻
      ctx.beginPath();
      ctx.moveTo(cx, cy - 4);
      ctx.lineTo(cx - (unfairness - 0.5) * 10, cy + headR * 0.18);
      ctx.strokeStyle = '#777777';
      ctx.lineWidth = 1;
      ctx.stroke();

      // 口
      ctx.beginPath();
      const mouthY = cy + headR * 0.36;
      ctx.moveTo(cx - 13 - envy * 5, mouthY + mouthContort);
      ctx.quadraticCurveTo(
        cx, mouthY - mouthContort * 1.1 + (sadness * 12),
        cx + 13 + anger * 9, mouthY - mouthContort
      );
      ctx.strokeStyle = '#111111';
      ctx.lineWidth = 2;
      ctx.stroke();

      // 5角形幾何学ポリゴンオーバーレイ
      ctx.beginPath();
      vibeValues.forEach((v, idx) => {
        const a = angles[idx];
        const r = radiusMax * (0.25 + v * 0.75);
        const px = cx + Math.cos(a) * r;
        const py = cy + Math.sin(a) * r;
        if (idx === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      });
      ctx.closePath();
      ctx.fillStyle = 'rgba(17, 17, 17, 0.04)';
      ctx.fill();
      ctx.strokeStyle = '#111111';
      ctx.lineWidth = 1;
      ctx.stroke();

      // ラベル
      if (showMetrics) {
        ctx.fillStyle = '#111111';
        ctx.font = '700 10px "Noto Sans JP", sans-serif';

        const labelPos = [
          { text: 'flowy', x: cx, y: cy - radiusMax - 10, align: 'center' },
          { text: 'deep', x: cx + radiusMax + 14, y: cy - 6, align: 'left' },
          { text: 'edgy', x: cx + radiusMax * 0.65, y: cy + radiusMax + 14, align: 'left' },
          { text: 'playful', x: cx - radiusMax * 0.65, y: cy + radiusMax + 14, align: 'right' },
          { text: 'moody', x: cx - radiusMax - 14, y: cy - 6, align: 'right' },
        ];

        labelPos.forEach(l => {
          ctx.textAlign = l.align;
          ctx.fillText(l.text, l.x, l.y);
        });
      }
    }

    // --- STEP 0: ロード / オープニング画面 ---
    function renderStep0Intro() {
      const t = i18n[currentLang];
      return `
        <div class="intro-poster relative min-h-screen fade-in flex flex-col justify-between p-6 bg-white select-none">
          
          <!-- 右上専用言語切替 (JP / EN) -->
          <div class="flex justify-end items-center pt-1">
            <div class="flex items-center text-[9px] font-mono border border-zinc-300 rounded-full p-0.5 bg-zinc-50">
              <button id="lang-btn-jp" class="px-2 py-0.5 rounded-full ${currentLang === 'JP' ? 'bg-black text-white font-bold' : 'text-zinc-500'} transition-all">JP</button>
              <button id="lang-btn-en" class="px-2 py-0.5 rounded-full ${currentLang === 'EN' ? 'bg-black text-white font-bold' : 'text-zinc-500'} transition-all">EN</button>
            </div>
          </div>

          <!-- メインタイポグラフィポスター (フォント太さ統一) -->
          <div class="my-auto space-y-4 md:space-y-6 py-2 flex flex-col items-center">
            
            <!-- 1行目 -->
            <div class="poster-row">
              <span class="poster-char">${t.posterLine1[0]}</span>
              <span class="poster-char">${t.posterLine1[1]}</span>
              <span class="poster-emoji">${t.posterLine1[2]}</span>

            </div>

            <!-- 2行目 -->

              <span class="poster-char">${t.posterLine2[2]}</span>

    // --- イベントリスナー ---
    function setupEventListeners() {
      // 言語切替ボタン
      const btnJp = document.getElementById('lang-btn-jp');
      if (btnJp) {
        btnJp.onclick = (e) => {
          e.stopPropagation();
          currentLang = 'JP';
          soundEngine.playSubtleClick();
          renderApp();
        };
      }

      const btnEn = document.getElementById('lang-btn-en');
      if (btnEn) {
        btnEn.onclick = (e) => {
          e.stopPropagation();
          currentLang = 'EN';
          soundEngine.playSubtleClick();
          renderApp();
        };
      }

      // STEP 0 -> STEP 1 スタート
      const startBtn = document.getElementById('btn-start-app');
      if (startBtn) {
        startBtn.onclick = () => {
          soundEngine.playSubtleClick();
          currentStep = 'vibe_check';
          renderApp();
        };
      }

      const navBurnBtn = document.getElementById('btn-nav-burn');
      if (navBurnBtn) {
        navBurnBtn.onclick = () => {
          currentStep = 'vibe_check';
          renderApp();
        };
      }

      document.querySelectorAll('.vibe-slider').forEach(slider => {
        slider.oninput = (e) => {
          const key = e.target.dataset.key;
          const val = Number(e.target.value);
          vibes[key] = val;

          const valSpan = document.getElementById(`val-${key}`);
          if (valSpan) valSpan.innerText = `${val}%`;

          soundEngine.playSubtleClick();

          const faceCanvas = document.getElementById('vibe-face-canvas');
          if (faceCanvas) {
            drawMinimalDistortedFace(faceCanvas, vibes, true);
          }
        };
      });

      // STEP 1 -> STEP 2
      const toBurnBtn = document.getElementById('btn-to-burn-step');
      if (toBurnBtn) {
        toBurnBtn.onclick = () => {
          soundEngine.playSubtleClick();
          currentStep = 'solo_burn';
          renderApp();
        };
      }

      // リアルタイム文字数制限カウント (200文字)
      const rantArea = document.getElementById('rant-textarea');
      if (rantArea) {
        rantArea.oninput = (e) => {
          rantText = e.target.value;
          const charCountSpan = document.getElementById('char-count');
          if (charCountSpan) {
            charCountSpan.innerText = rantText.length;
          }
        };
      }

      // カテゴリタグ選択
      document.querySelectorAll('.tag-btn').forEach(btn => {
        btn.onclick = (e) => {
          selectedTag = e.target.dataset.tag;
          renderApp();
        };
      });

      // 新規タグ追加ボタン
      const addTagBtn = document.getElementById('btn-add-tag');
      if (addTagBtn) {
        addTagBtn.onclick = () => {
          const input = document.getElementById('new-tag-input');
          if (input && input.value.trim()) {
            let val = input.value.trim();
            if (!val.startsWith('#')) val = '#' + val;
            if (!categoryTags.includes(val)) {
              categoryTags.push(val);
              selectedTag = val;
              soundEngine.playSubtleClick();
              renderApp();
            }
          }
        };
      }

      // STEP 2 -> STEP 3 炎上させる実行
      const executeBurnBtn = document.getElementById('btn-execute-burn');
      if (executeBurnBtn) {
        executeBurnBtn.onclick = () => {
          const textarea = document.getElementById('rant-textarea');
          const val = textarea ? textarea.value.trim() : rantText.trim();
          if (!val) return;

          const fireCanvas = document.getElementById('fire-canvas');
          if (fireCanvas) {
            fireCanvas.classList.remove('hidden');
            fireCanvas.width = fireCanvas.parentElement.clientWidth;
            fireCanvas.height = fireCanvas.parentElement.clientHeight;

            soundEngine.playSoftBurn();

            const ctx = fireCanvas.getContext('2d');
            let particles = [];
            for (let i = 0; i < 120; i++) {
              particles.push({
                x: fireCanvas.width / 2 + (Math.random() - 0.5) * 80,
                y: fireCanvas.height / 2 + (Math.random() - 0.5) * 50,
                vx: (Math.random() - 0.5) * 7,
                vy: -Math.random() * 7 - 2,
                size: Math.random() * 4 + 2,
                color: ['#111111', '#555555', '#888888', '#CCCCCC'][Math.floor(Math.random() * 4)],
                alpha: 1,
                decay: Math.random() * 0.035 + 0.02
              });
            }

            let step = 0;
            function animateFire() {
              ctx.fillStyle = 'rgba(255, 255, 255, 0.28)';
              ctx.fillRect(0, 0, fireCanvas.width, fireCanvas.height);
              let alive = 0;
              particles.forEach(p => {
                if (p.alpha > 0) {
                  alive++;
                  p.x += p.vx;
                  p.y += p.vy;
                  p.alpha -= p.decay;
                  ctx.save();
                  ctx.globalAlpha = Math.max(0, p.alpha);
                  ctx.fillStyle = p.color;
                  ctx.fillRect(p.x, p.y, p.size, p.size);
                  ctx.restore();
                }
              });
              step++;
              if (alive > 0 && step < 65) {
                requestAnimationFrame(animateFire);
              } else {
                fireCanvas.classList.add('hidden');

                const maxVibeKey = Object.keys(vibes).reduce((a, b) => vibes[a] > vibes[b] ? a : b);
                const vibeNameMap = { anger: 'いらいら', sadness: '悲しい', unfairness: '理不尽', envy: '嫉妬', void: '虚無' };

                const paperTitles = ['THE DAILY JOURNAL', 'THE WALL STREET JOURNAL', 'THE EVENING POST', 'NEWSDAY ARCHIVE', 'DAILY CHRONICLE'];
                const randomPaperTitle = paperTitles[Math.floor(Math.random() * paperTitles.length)];

                posts.unshift({
                  id: `post-${Date.now()}`,
                  paperTitle: randomPaperTitle,
                  dateStr: 'JUST NOW',
                  text: val,
                  vibeCategory: vibeNameMap[maxVibeKey] || 'お焚き上げ',
                  authorVibe: { ...vibes },
                  gasshoCount: 1,
                  tag: selectedTag,
                });

                burnStats.totalBurned += 1;
                rantText = '';

                currentStep = 'chaos_gallery';
                renderApp();
              }
            }
            animateFire();
          }
        };
      }

      const navChaos = document.getElementById('nav-chaos');
      if (navChaos) {
        navChaos.onclick = () => { currentStep = 'chaos_gallery'; soundEngine.playSubtleClick(); renderApp(); };
      }
      const navProfile = document.getElementById('nav-profile');
      if (navProfile) {
        navProfile.onclick = () => { currentStep = 'profile'; soundEngine.playSubtleClick(); renderApp(); };
      }

      document.querySelectorAll('.btn-gassho').forEach(btn => {
        btn.onclick = (e) => {
          const postId = e.currentTarget.dataset.postid;
          soundEngine.playGasshoBell();

          const post = posts.find(p => p.id === postId);
          if (post) {
            post.gasshoCount += 1;
            burnStats.gasshoGiven += 1;

            const countSpan = document.getElementById(`gassho-count-${postId}`);
            if (countSpan) countSpan.innerText = post.gasshoCount;
          }
        };
      });

      const recreateBtn = document.getElementById('btn-recreate-vibe');
      if (recreateBtn) {
        recreateBtn.onclick = () => {
          currentStep = 'vibe_check';
          renderApp();
        };
      }
    }

    window.onload = function() {
      renderApp();
    };
  </script>
