    // --- Web Audio API サウンドエンジン（静寂で洗練された音色） ---
    const soundEngine = {
      audioCtx: null,
      getCtx() {
        if (!this.audioCtx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.audioCtx = new AudioCtx();
        }
        if (this.audioCtx && this.audioCtx.state === 'suspended') {
          this.audioCtx.resume();
        }
        return this.audioCtx;
      },
      playSoftBurn() {
        try {
          const ctx = this.getCtx();
          if (!ctx) return;
          const bufferSize = ctx.sampleRate * 0.8;
          const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * 0.3;
          }
          const noise = ctx.createBufferSource();
          noise.buffer = buffer;
          const filter = ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(400, ctx.currentTime);
          filter.frequency.exponentialRampToValueAtTime(60, ctx.currentTime + 0.7);
          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.75);
          noise.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);
          noise.start();
        } catch (e) { console.error(e); }
      },
      playGasshoBell() {
        try {
          const ctx = this.getCtx();
          if (!ctx) return;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(875, ctx.currentTime + 1.8);
          gain.gain.setValueAtTime(0.25, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.8);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 1.8);
        } catch (e) { console.error(e); }
      },
      playSubtleClick() {
        try {
          const ctx = this.getCtx();
          if (!ctx) return;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, ctx.currentTime);
          gain.gain.setValueAtTime(0.05, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.04);
        } catch (e) { console.error(e); }

    // --- ミニマル・モード調 歪み顔 & POLA APEX風幾何学レーダー描画 ---
    function drawMinimalDistortedFace(canvas, vibesData, showMetrics = true) {
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const width = canvas.width;
      const height = canvas.height;
      const cx = width / 2;
      const cy = height / 2;

      ctx.clearRect(0, 0, width, height);

      // 白背景
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, width, height);

      // 洗練された細い同心円レーダー枠
      const radiusMax = width * 0.36;
      ctx.strokeStyle = '#E2E2E5';
      ctx.lineWidth = 1;
      [0.25, 0.5, 0.75, 1.0].forEach(r => {
        ctx.beginPath();
        ctx.arc(cx, cy, radiusMax * r, 0, Math.PI * 2);
        ctx.stroke();
      });

      // 5軸の極細ガイド線
      const angles = [
        -Math.PI / 2,                // 上: いらいら (flowy/anger)
        -Math.PI / 2 + (Math.PI * 2 / 5),     // 右上: 理不尽 (deep/unfairness)
        -Math.PI / 2 + (Math.PI * 4 / 5),     // 右下: 虚無 (edgy/void)
        -Math.PI / 2 + (Math.PI * 6 / 5),     // 左下: 嫉妬 (playful/envy)
        -Math.PI / 2 + (Math.PI * 8 / 5)      // 左上: 悲しい (moody/sadness)
      ];

      ctx.strokeStyle = '#EBEBEF';
      angles.forEach(a => {
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(a) * radiusMax, cy + Math.sin(a) * radiusMax);
        ctx.stroke();
      });

      const anger = (vibesData.anger || 50) / 100;
      const sadness = (vibesData.sadness || 50) / 100;
      const unfairness = (vibesData.unfairness || 50) / 100;
      const envy = (vibesData.envy || 50) / 100;
      const voidVal = (vibesData.void || 50) / 100;

      // 変形パラメーター
      const headSkewX = (unfairness - 0.5) * (width * 0.15);
      const headStretchY = (anger * 25) - (sadness * 20);
      const eyeDroop = sadness * 14;
      const eyeStretchX = envy * 16;
      const mouthContort = (anger * 18) - (voidVal * 14);

      ctx.save();
      ctx.translate(cx + headSkewX, cy);

      // モード調・シンプル輪郭（極細黒ライン）
      ctx.beginPath();
      const headR = width * 0.25;
      ctx.fillStyle = '#FAFAFC';
      ctx.strokeStyle = '#111111';
      ctx.lineWidth = 1.5;

      for (let a = 0; a < Math.PI * 2; a += 0.1) {
        let r = headR;
        if (a > Math.PI * 0.2 && a < Math.PI * 0.8) {
          r += sadness * 20 - anger * 10;
        } else if (a > Math.PI * 1.2 && a < Math.PI * 1.8) {
          r += anger * 16;
        }
        r += Math.sin(a * 5) * (voidVal * 8);

        const px = Math.cos(a) * (r + envy * 6);
        const py = Math.sin(a) * (r + headStretchY * 0.5);
        if (a === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 左目（シンプル＆ミニマル）
      ctx.save();
      ctx.translate(-headR * 0.4 - eyeStretchX / 2, -headR * 0.15 + eyeDroop);
      ctx.rotate((sadness - anger) * 0.3);
      ctx.beginPath();
      ctx.ellipse(0, 0, Math.max(4, 11 + eyeStretchX * 0.6), Math.max(2, 6 + anger * 6), 0, 0, Math.PI * 2);
      ctx.fillStyle = '#111111';
      ctx.fill();

      ctx.beginPath();
      ctx.arc((envy - 0.5) * 6, (unfairness - 0.5) * 4, 2.5, 0, Math.PI * 2);
      ctx.fillStyle = '#FFFFFF'; ctx.fill();
      ctx.restore();

      // 右目
      ctx.save();
      ctx.translate(headR * 0.38 + eyeStretchX / 3, -headR * 0.15 - eyeDroop / 2);
      ctx.rotate((anger - sadness) * 0.4);
      ctx.beginPath();
      ctx.ellipse(0, 0, Math.max(4, 10 + anger * 9), Math.max(2, 7 + sadness * 5), 0.15, 0, Math.PI * 2);
      ctx.fillStyle = '#111111';
      ctx.fill();

      ctx.beginPath();
      ctx.arc((0.5 - envy) * 5, (0.5 - anger) * 5, 2.5, 0, Math.PI * 2);
      ctx.fillStyle = '#FFFFFF'; ctx.fill();
      ctx.restore();

      // 鼻
      ctx.beginPath();
      ctx.moveTo(0, -6);
      ctx.lineTo(-headSkewX * 0.15, headR * 0.2);
      ctx.strokeStyle = '#777777';
      ctx.lineWidth = 1;
      ctx.stroke();

      // 口
      ctx.beginPath();
      const mouthY = headR * 0.38;
      ctx.moveTo(-16 - envy * 6, mouthY + mouthContort);
      ctx.quadraticCurveTo(
        0, mouthY - mouthContort * 1.2 + (sadness * 16),
        16 + anger * 10, mouthY - mouthContort
      );
      ctx.strokeStyle = '#111111';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.restore();

      // レーダーポリゴン（感情強度の幾何学チャート描画）
      const vibeValues = [anger, unfairness, voidVal, envy, sadness];
      ctx.beginPath();
      vibeValues.forEach((v, idx) => {
        const a = angles[idx];
        const r = radiusMax * (0.25 + v * 0.75);
        const px = cx + Math.cos(a) * r;
        const py = cy + Math.sin(a) * r;
        if (idx === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      });
      ctx.closePath();
      ctx.fillStyle = 'rgba(17, 17, 17, 0.04)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(17, 17, 17, 0.6)';
      ctx.lineWidth = 1;
      ctx.stroke();

      // チャート先端の小さな黒ドット
      vibeValues.forEach((v, idx) => {
        const a = angles[idx];
        const r = radiusMax * (0.25 + v * 0.75);
        const px = cx + Math.cos(a) * r;
        const py = cy + Math.sin(a) * r;
        ctx.beginPath();
        ctx.arc(px, py, 2.5, 0, Math.PI * 2);
        ctx.fillStyle = '#111111';
        ctx.fill();
      });

      // 画像2枚目風の軸テキストラベル表示
      if (showMetrics) {
        ctx.fillStyle = '#555555';
        ctx.font = '10px "Space Grotesk", sans-serif';

        const labelPos = [
          { text: 'flowy', sub: `いらいら ${vibesData.anger}%`, x: cx, y: cy - radiusMax - 12, align: 'center' },
          { text: 'deep', sub: `理不尽 ${vibesData.unfairness}%`, x: cx + radiusMax + 18, y: cy - 10, align: 'left' },
          { text: 'edgy', sub: `虚無 ${vibesData.void}%`, x: cx + radiusMax * 0.7, y: cy + radiusMax + 18, align: 'left' },
          { text: 'playful', sub: `嫉妬 ${vibesData.envy}%`, x: cx - radiusMax * 0.7, y: cy + radiusMax + 18, align: 'right' },
          { text: 'moody', sub: `悲しい ${vibesData.sadness}%`, x: cx - radiusMax - 18, y: cy - 10, align: 'right' },
        ];

        labelPos.forEach(l => {
          ctx.textAlign = l.align;
          ctx.fillStyle = '#111111';
          ctx.font = '500 11px "Space Grotesk"';
          ctx.fillText(l.text, l.x, l.y);
        });
      }
    }

          <!-- タブ切り替え -->
          <div class="flex justify-center border-b border-paper-border font-sans">
            <button id="tab-chaos" class="py-3 px-6 text-xs md:text-sm font-semibold border-b-2 transition-all flex items-center gap-2 ${
              activeTab === 'chaos_gallery' ? 'border-black text-black' : 'border-transparent text-zinc-400 hover:text-zinc-700'
            }">
              <span>みんなのお焚き上げ</span>
              <span class="bg-zinc-100 text-zinc-700 text-[10px] px-2 py-0.5 rounded-full font-mono font-medium">${posts.length}</span>
            </button>

            <button id="tab-solo" class="py-3 px-6 text-xs md:text-sm font-semibold border-b-2 transition-all flex items-center gap-2 ${
              activeTab === 'solo_burn' ? 'border-black text-black' : 'border-transparent text-zinc-400 hover:text-zinc-700'
            }">
              <span>自分の感情を焚き上げる</span>
            </button>

            <button id="tab-profile" class="py-3 px-6 text-xs md:text-sm font-semibold border-b-2 transition-all flex items-center gap-2 ${
              activeTab === 'profile' ? 'border-black text-black' : 'border-transparent text-zinc-400 hover:text-zinc-700'
            }">
              <span>感情パスポート</span>
            </button>
          </div>

          ${activeTab === 'chaos_gallery' ? renderChaosGalleryTab() : ''}
          ${activeTab === 'solo_burn' ? renderSoloBurnTab() : ''}
          ${activeTab === 'profile' ? renderProfileTab() : ''}
        </div>
      `;
    }

    // --- TAB 1: みんなのお焚き上げ（添付画像1枚目参照：新聞が重なって並ぶスタック表示） ---
    function renderChaosGalleryTab() {
      return `
        <div class="flex-1 flex flex-col items-center">
          <div class="text-center mb-6">
            <p class="text-xs text-zinc-500 font-sans tracking-wide">
              誰かがお焚き上げした投稿が新聞のように重なって保管されています
            </p>
          </div>

          <!-- 新聞が縦に重なって並ぶスタック表示 -->
          <div class="newspaper-stack w-full max-w-xl">
            ${posts.map((post, idx) => `
              <div
                id="post-card-${post.id}"
                class="newspaper-card p-6 md:p-7"
                style="z-index: ${posts.length - idx};"
              >
                <!-- 新聞ヘッダー -->
                <div class="border-b border-zinc-900 pb-2 mb-4 flex items-center justify-between">
                  <div>
                    <h4 class="font-serif font-extrabold text-base md:text-lg tracking-wider text-black uppercase leading-none">
                      ${post.paperTitle}
                    </h4>
                    <span class="text-[9px] font-mono text-zinc-500 uppercase tracking-widest">
                      ${post.dateStr}
                    </span>
                  </div>
                  <div class="text-right">
                    <span class="inline-block border border-black px-1.5 py-0.5 text-[9px] font-semibold text-black">
                      ${post.vibeCategory}
                    </span>
                  </div>
                </div>

                <!-- 投稿文面（新聞の記事見出し風） -->
                <div class="mb-6">
                  <p class="font-serif text-sm md:text-base leading-relaxed text-zinc-900 font-medium">
                    “ ${post.text} ”
                  </p>
                </div>

                <!-- 新聞フッター（合掌ボタン & レーダーアイコン） -->
                <div class="flex items-center justify-between border-t border-zinc-200 pt-3">
                  <div class="flex items-center gap-3">
                    <div class="border border-zinc-300 p-0.5 bg-white rounded-sm">
                      <canvas id="card-canvas-${post.id}" class="block"></canvas>
                    </div>
                    <div>
                      <span class="text-[10px] text-zinc-500 font-mono block">${post.tag}</span>
                      <span class="text-xs font-semibold text-black">合掌: <span id="gassho-count-${post.id}">${post.gasshoCount}</span></span>
                    </div>
                  </div>

                  <button
                    data-postid="${post.id}"
                    class="btn-gassho px-4 py-2 border border-black text-black hover:bg-black hover:text-white transition-all text-xs font-medium tracking-wide flex items-center gap-1.5"
                  >
                    <span>🙏 合掌する</span>
                  </button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // --- TAB 2: ソロお焚き上げ ---
    function renderSoloBurnTab() {
      return `
        <div class="flex-1 flex flex-col max-w-xl mx-auto w-full">
          <div id="solo-burn-card" class="bg-white border border-paper-border p-8 shadow-sm rounded-sm relative overflow-hidden">
            <canvas id="fire-canvas" class="absolute inset-0 z-50 pointer-events-none w-full h-full hidden"></canvas>

            <div class="mb-6 border-b border-zinc-200 pb-3 flex items-center justify-between">
              <span class="font-sans text-xs text-zinc-500 font-medium uppercase tracking-wider">
                WRITE & RELEASE
              </span>
              <span class="text-xs text-black font-semibold">匿名で浄化</span>
            </div>

            <div class="mb-5">
              <label class="block font-sans text-xs text-zinc-600 mb-2">
                吐き出したい愚痴やネガティブな感情を入力してください
              </label>
              <textarea
                id="rant-textarea"
                placeholder="例: 理不尽な指示、消化できないイライラ、言葉にできないモヤモヤ... 何でも書いて手放してください。"
                rows="6"
                class="w-full bg-paper text-zinc-900 p-4 border border-zinc-300 focus:border-black focus:bg-white focus:outline-none font-sans text-sm leading-relaxed resize-none transition-colors"
              >${rantText}</textarea>
            </div>

            <div class="mb-6">
              <span class="block font-sans text-xs text-zinc-600 mb-2">カテゴリ:</span>
              <div class="flex flex-wrap gap-2 font-sans text-xs">
                ${['#仕事', '#人間関係', '#恋愛', '#自分', '#理不尽', '#社会'].map(tag => `
                  <button data-tag="${tag}" class="tag-btn px-3 py-1.5 border ${
                    selectedTag === tag ? 'bg-black text-white border-black font-medium' : 'bg-white text-zinc-600 border-zinc-300 hover:border-zinc-500'
                  } transition-colors">${tag}</button>
                `).join('')}
              </div>
            </div>

            <button
              id="btn-execute-burn"
              class="w-full py-4 bg-black text-white font-sans text-xs font-semibold tracking-widest uppercase hover:bg-zinc-800 transition-colors cursor-pointer"
            >
              🔥 燃やして手放す
            </button>
          </div>
        </div>
      `;
    }

    // --- TAB 3: 感情パスポート ---
    function renderProfileTab() {
      return `
        <div class="flex-1 flex flex-col items-center justify-center max-w-md mx-auto w-full py-4">
          <div class="bg-white border border-paper-border p-8 w-full shadow-sm">
            <div class="flex justify-between items-center border-b border-zinc-200 pb-4 mb-6">
              <div>
                <div class="text-[10px] text-zinc-400 font-mono tracking-widest">EMOTIONAL PASSPORT</div>
                <div class="text-base font-bold text-black font-sans">USER_ID: #ANON-${Math.floor(vibes.anger * 77)}</div>
              </div>
              <div class="text-right text-[10px] text-zinc-400 font-mono">
                OTAKIAGE PLATFORM
              </div>
            </div>

            <div class="flex flex-col items-center mb-6">
              <div class="bg-white p-2">
                <canvas id="profile-face-canvas" class="block"></canvas>
              </div>

              <div class="grid grid-cols-3 gap-2 w-full mt-6 text-center font-sans text-xs border border-zinc-200 p-4 bg-paper">
                <div>
                  <div class="text-zinc-500 text-[10px]">お焚き上げ数</div>
                  <div class="text-black font-semibold text-sm mt-1">${burnStats.totalBurned}回</div>
                </div>
                <div class="border-x border-zinc-300">
                  <div class="text-zinc-500 text-[10px]">送った合掌</div>
                  <div class="text-black font-semibold text-sm mt-1">${burnStats.gasshoGiven}回</div>
                </div>
                <div>
                  <div class="text-zinc-500 text-[10px]">浄化された灰</div>
                  <div class="text-black font-semibold text-sm mt-1">${burnStats.ashWeight}</div>
                </div>
              </div>
            </div>

            <button id="btn-recreate-vibe" class="w-full py-3 bg-white border border-zinc-300 text-zinc-800 font-sans text-xs font-semibold hover:bg-black hover:text-white hover:border-black transition-colors">
              本日の感情と顔を再設定する
            </button>
          </div>
        </div>
      `;
    }

    // --- イベントリスナー ---
    function setupEventListeners() {
      const logoBtn = document.getElementById('btn-header-logo');
      if (logoBtn) {
        logoBtn.onclick = () => {
          currentView = 'vibe_check';
          renderApp();
        };
      }

      const reconfigBtn = document.getElementById('btn-reconfig');
      if (reconfigBtn) {
        reconfigBtn.onclick = () => {
          currentView = 'vibe_check';
          renderApp();
        };
      }

      document.querySelectorAll('.vibe-slider').forEach(slider => {
        slider.oninput = (e) => {
          const key = e.target.dataset.key;
          const val = Number(e.target.value);
          vibes[key] = val;

          const valSpan = document.getElementById(`val-${key}`);
          if (valSpan) valSpan.innerText = `${val}%`;

          soundEngine.playSubtleClick();

          const faceCanvas = document.getElementById('vibe-face-canvas');
          if (faceCanvas) {
            drawMinimalDistortedFace(faceCanvas, vibes, true);
          }
        };
      });

      const enterBtn = document.getElementById('btn-enter-home');
      if (enterBtn) {
        enterBtn.onclick = () => {
          soundEngine.playGasshoBell();
          currentView = 'home';
          renderApp();
        };
      }

      const tabChaos = document.getElementById('tab-chaos');
      if (tabChaos) {
        tabChaos.onclick = () => { activeTab = 'chaos_gallery'; soundEngine.playSubtleClick(); renderApp(); };
      }
      const tabSolo = document.getElementById('tab-solo');
      if (tabSolo) {
        tabSolo.onclick = () => { activeTab = 'solo_burn'; soundEngine.playSubtleClick(); renderApp(); };
      }
      const tabProfile = document.getElementById('tab-profile');
      if (tabProfile) {
        tabProfile.onclick = () => { activeTab = 'profile'; soundEngine.playSubtleClick(); renderApp(); };
      }

      const rantArea = document.getElementById('rant-textarea');
      if (rantArea) {
        rantArea.oninput = (e) => {
          rantText = e.target.value;
        };
      }

      document.querySelectorAll('.tag-btn').forEach(btn => {
        btn.onclick = (e) => {
          selectedTag = e.target.dataset.tag;
          renderApp();
        };
      });

      const executeBurnBtn = document.getElementById('btn-execute-burn');
      if (executeBurnBtn) {
        executeBurnBtn.onclick = () => {
          const textarea = document.getElementById('rant-textarea');
          const val = textarea ? textarea.value.trim() : rantText.trim();
          if (!val) return;

          const fireCanvas = document.getElementById('fire-canvas');
          if (fireCanvas) {
            fireCanvas.classList.remove('hidden');
            fireCanvas.width = fireCanvas.parentElement.clientWidth;
            fireCanvas.height = fireCanvas.parentElement.clientHeight;

            soundEngine.playSoftBurn();

            const ctx = fireCanvas.getContext('2d');
            let particles = [];
            for (let i = 0; i < 140; i++) {
              particles.push({
                x: fireCanvas.width / 2 + (Math.random() - 0.5) * 100,
                y: fireCanvas.height / 2 + (Math.random() - 0.5) * 60,
                vx: (Math.random() - 0.5) * 8,
                vy: -Math.random() * 8 - 2,
                size: Math.random() * 5 + 2,
                color: ['#111111', '#555555', '#888888', '#CCCCCC'][Math.floor(Math.random() * 4)],
                alpha: 1,
                decay: Math.random() * 0.03 + 0.02
              });
            }

            let step = 0;
            function animateFire() {
              ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
              ctx.fillRect(0, 0, fireCanvas.width, fireCanvas.height);
              let alive = 0;
              particles.forEach(p => {
                if (p.alpha > 0) {
                  alive++;
                  p.x += p.vx;
                  p.y += p.vy;
                  p.alpha -= p.decay;
                  ctx.save();
                  ctx.globalAlpha = Math.max(0, p.alpha);
                  ctx.fillStyle = p.color;
                  ctx.fillRect(p.x, p.y, p.size, p.size);
                  ctx.restore();
                }
              });
              step++;
              if (alive > 0 && step < 70) {
                requestAnimationFrame(animateFire);
              } else {
                fireCanvas.classList.add('hidden');

                const maxVibeKey = Object.keys(vibes).reduce((a, b) => vibes[a] > vibes[b] ? a : b);
                const vibeNameMap = { anger: 'いらいら', sadness: '悲しい', unfairness: '理不尽', envy: '嫉妬', void: '虚無' };

                const paperTitles = ['THE DAILY JOURNAL', 'THE WALL STREET JOURNAL', 'THE EVENING POST', 'NEWSDAY ARCHIVE', 'DAILY CHRONICLE'];
                const randomPaperTitle = paperTitles[Math.floor(Math.random() * paperTitles.length)];

                posts.unshift({
                  id: `post-${Date.now()}`,
                  paperTitle: randomPaperTitle,
                  dateStr: 'JUST NOW',
                  text: val,
                  vibeCategory: vibeNameMap[maxVibeKey] || 'お焚き上げ',
                  authorVibe: { ...vibes },
                  gasshoCount: 1,
                  tag: selectedTag,
                });

                burnStats.totalBurned += 1;
                rantText = '';
                activeTab = 'chaos_gallery';
                renderApp();
              }
            }
            animateFire();
          }
        };
      }

      document.querySelectorAll('.btn-gassho').forEach(btn => {
        btn.onclick = (e) => {
          const postId = e.currentTarget.dataset.postid;
          soundEngine.playGasshoBell();

          const post = posts.find(p => p.id === postId);
          if (post) {
            post.gasshoCount += 1;
            burnStats.gasshoGiven += 1;

            const countSpan = document.getElementById(`gassho-count-${postId}`);
            if (countSpan) countSpan.innerText = post.gasshoCount;
          }
        };
      });

      const recreateBtn = document.getElementById('btn-recreate-vibe');
      if (recreateBtn) {
        recreateBtn.onclick = () => {
          currentView = 'vibe_check';
          renderApp();
        };
      }
    }

    window.onload = function() {
      renderApp();
    };
  </script>
</body>
</html>
