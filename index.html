<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔥</text></svg>">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Three.js 3D Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            paper: {
              DEFAULT: '#FAFAFC',
              card: '#FFFFFF',
              border: '#EFF3F4',
              dark: '#0F1419',
              muted: '#536471',
              accent: '#1D9BF0',
            }
          },
          fontFamily: {
            sans: ['"LINE Seed Sans"', '"LINE Seed JP"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    @font-face {
      font-family: 'LINE Seed Sans';
      src: url('fonts/LINESeedSans_W_Rg.woff2') format('woff2'),
           url('fonts/LINESeedSans_W_Rg.woff') format('woff');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'LINE Seed Sans';
      src: url('fonts/LINESeedSans_W_Bd.woff2') format('woff2'),
           url('fonts/LINESeedSans_W_Bd.woff') format('woff');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'LINE Seed JP';
      src: url('fonts/LINESeedJP_OTF_Rg.woff2') format('woff2'),
           url('fonts/LINESeedJP_OTF_Rg.woff') format('woff'),
           url('fonts/LINESeedJP_TTF_Rg.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'LINE Seed JP';
      src: url('fonts/LINESeedJP_OTF_Bd.woff2') format('woff2'),
           url('fonts/LINESeedJP_OTF_Bd.woff') format('woff'),
           url('fonts/LINESeedJP_TTF_Bd.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'LINE Seed JP';
      src: url('fonts/LINESeedJP_OTF_Eb.woff2') format('woff2'),
           url('fonts/LINESeedJP_OTF_Eb.woff') format('woff');
      font-weight: 900;
      font-style: normal;
      font-display: swap;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      box-shadow: none !important;
      font-family: 'LINE Seed Sans', 'LINE Seed JP', sans-serif !important;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      background-color: #FFFFFF;
      color: #0F1419;
      font-family: 'LINE Seed Sans', 'LINE Seed JP', sans-serif !important;
      overflow-x: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      touch-action: pan-x pan-y;
      -webkit-text-size-adjust: 100%;
    }

    body.no-scroll {
      overflow-y: hidden;
      touch-action: none;
    }

    /* 全画面最前面レイヤー：上部（アセット 3）＆ 下部（アセット 4）牙フレーム */
    .app-top-teeth-frame {
      position: fixed;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      width: 100vw;
      max-width: 448px;
      height: auto;
      z-index: 9999;
      pointer-events: none;
      display: none;
      transition: transform 0.75s cubic-bezier(0.77, 0, 0.175, 1);
    }

    .app-bottom-teeth-frame {
      position: fixed;
      bottom: -14px;
      left: 50%;
      transform: translateX(-50%);
      width: 100vw;
      max-width: 448px;
      height: auto;
      z-index: 9999;
      pointer-events: none;
      display: none;
      transition: transform 0.75s cubic-bezier(0.77, 0, 0.175, 1);
    }

    /* タイトル画面のみ上下の歯フレームを両方表示 */
    body.is-intro .app-top-teeth-frame,
    body.is-intro .app-bottom-teeth-frame {
      display: block;
    }

    /* 掲示板・お焚き上げ・IDページでは上の歯のみ表示（下はなし） */
    body.show-teeth .app-top-teeth-frame {
      display: block;
    }

    /* 牙がガツンと噛み合うアグレッシブなアニメーション */
    .app-top-teeth-frame.bite-snap {
      transform: translateX(-50%) translateY(45%);
    }

    .app-bottom-teeth-frame.bite-snap {
      transform: translateX(-50%) translateY(-45%);
    }

    /* 噛み合った後にガバッと上下に開いて画面外へ全開逃走 */
    .app-top-teeth-frame.open-wide {
      transform: translateX(-50%) translateY(-120%);
    }

    .app-bottom-teeth-frame.open-wide {
      transform: translateX(-50%) translateY(120%);
    }

    /* 全画面ジャストフィット用コンテナ */
    .screen-container {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100dvh;
      padding-top: max(7.0rem, calc(env(safe-area-inset-top) + 6.0rem));
      padding-bottom: max(4.5rem, calc(env(safe-area-inset-bottom) + 3.5rem));
      padding-left: 1.25rem;
      padding-right: 1.25rem;
      overflow: hidden;
    }

    /* ポスタータイトルの縦列整列 ＆ 行間詰めつつ16vwの最適サイズで画面中央やや下寄りに配置 */
    .poster-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      row-gap: 0.15rem;
      column-gap: -7px;
      width: 100%;
      max-width: 245px;
      margin: 0 auto;
    }

    .poster-cell {
      display: flex;
      align-items: center;
      justify-content: center;
      height: auto;
      aspect-ratio: 1;
    }

    .poster-char {
      font-weight: 400 !important;
      font-size: 16vw;
      color: #111111;
      font-family: 'LINE Seed Sans', 'LINE Seed JP', sans-serif !important;
      line-height: 1;
      text-align: center;
      display: inline-block;
      transform: scaleX(0.65);
      transform-origin: center center;
    }

    @media (min-width: 500px) {
      .poster-char {
        font-size: 4.6rem;
      }
    }

    .poster-emoji {
      font-size: 14vw;
      line-height: 1;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: none !important;
    }

    @media (min-width: 500px) {
      .poster-emoji {
        font-size: 4.0rem;
      }
    }

    /* カスタムスライダー */
    input[type=range] {
      -webkit-appearance: none;
      background: #EBEBEF;
      height: 3px;
      border-radius: 2px;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 13px;
      width: 13px;
      border-radius: 50%;
      background: #111111;
      cursor: pointer;
    }

    /* 本格リアル火炎 Canvas オーバーレイ */
    #real-fire-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 99999;
      pointer-events: none;
      display: none;
    }

    #real-fire-canvas.active {
      display: block;
      animation: fireCanvasFade 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fireCanvasFade {
      0% { opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { opacity: 0; }
    }

    /* カード枠内専用：底辺から上へゆらゆらメラメラ立ち上るたくさんの炎アニメーション */
    .card-rising-flames {
      position: absolute;
      bottom: -10px;
      left: 0;
      right: 0;
      height: 100%;
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      pointer-events: none;
      z-index: 20;
    }

    .rising-flame-icon {
      font-size: 24px;
      animation: flameRise 1.2s infinite ease-out;
      opacity: 0;
    }

    .rising-flame-icon:nth-child(1) { animation-delay: 0s; }
    .rising-flame-icon:nth-child(2) { animation-delay: 0.15s; }
    .rising-flame-icon:nth-child(3) { animation-delay: 0.3s; }
    .rising-flame-icon:nth-child(4) { animation-delay: 0.1s; }
    .rising-flame-icon:nth-child(5) { animation-delay: 0.25s; }
    .rising-flame-icon:nth-child(6) { animation-delay: 0.4s; }

    @keyframes flameRise {
      0% {
        transform: translateY(20px);
        opacity: 0;
      }
      30% {
        opacity: 0.95;
      }
      80% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(-90px);
        opacity: 0;
      }
    }

    /* 現X (旧Twitter) 風タイムラインUI */
    .x-post-card {
      width: 100%;
      background: #FFFFFF;
      border-bottom: 1px solid #EFF3F4;
      padding: 14px 16px;
      transition: background-color 0.2s ease;
      cursor: pointer;
    }
    .x-post-card:active {
      background-color: #F7F9F9;
    }

    /* TAP ENTRY 明滅アニメーション */
    .tap-entry-text {
      animation: tapEntryBlink 1.8s infinite ease-in-out;
    }
    @keyframes tapEntryBlink {
      0%, 100% { opacity: 0.25; transform: scale(0.98); }
      50% { opacity: 0.85; transform: scale(1.02); }
    }

    /* クリーン平面ボトムバー */
    .flat-bottom-nav {
      position: fixed;
      bottom: 16px;
      left: 16px;
      right: 16px;
      max-width: 416px;
      margin: 0 auto;
      z-index: 40;
      background-color: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(239, 243, 244, 0.8);
      border-radius: 24px;
      padding: 6px 16px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
      padding-bottom: calc(6px + env(safe-area-inset-bottom));
    }

    /* 白黒反転スタイル（「いま、どんな気分？」画面用） */
    .flat-bottom-nav.inverted-theme {
      background-color: rgba(15, 20, 25, 0.85) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    /* 2/3ボトムシートモーダル出現・閉じるアニメーション */
    .bottom-sheet-slide-up {
      animation: bottomSheetUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes bottomSheetUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .bottom-sheet-slide-down {
      animation: bottomSheetDown 0.25s cubic-bezier(0.4, 0, 1, 1) forwards;
    }
    @keyframes bottomSheetDown {
      from { transform: translateY(0); }
      to { transform: translateY(100%); }
    }

    .fade-in {
      animation: fadeIn 0.3s ease forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .animate-float-slow {
      animation: floatSlow 5s ease-in-out infinite;
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
  </style>
</head>

  <img src="images/bottom_teeth_frame.png" class="app-bottom-teeth-frame" alt="Lower Teeth Frame" />

  <script>
    // --- Web Audio API 低遅延即時サウンドエンジン ---
    const soundEngine = {
      audioCtx: null,
      getAudioContext() {
        if (!this.audioCtx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.audioCtx = new AudioCtx();
        }
        if (this.audioCtx && this.audioCtx.state === 'suspended') {
          this.audioCtx.resume();
        }
        return this.audioCtx;
      },
      playAudio(src) {
        try {
          const audio = new Audio(src);
          audio.currentTime = 0;
          audio.play().catch(e => {});
        } catch (e) {}
      },
      playSoftBurn() {
        this.playAudio('audio/horagai.mp3');
      },
      playGasshoBell() {
        this.playAudio('audio/kanadarai.mp3');
      },
      playSubtleClick() {
        try {
          const ctx = this.getAudioContext();
          if (!ctx) return;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(750, ctx.currentTime);
          gain.gain.setValueAtTime(0.08, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.02);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.02);
        } catch (e) {}
      }
    };

    let capturedPhotoImg = null;

    function createCustomPresetFaceTexture(skinColor, eyeColor, lipColor, hairStyle = 'normal') {
      const canvas = document.createElement('canvas');
      canvas.width = 300;
      canvas.height = 300;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, 300, 300);

      const skinGrad = ctx.createRadialGradient(150, 150, 20, 150, 150, 140);
      skinGrad.addColorStop(0, skinColor[0]);
      skinGrad.addColorStop(0.7, skinColor[1]);
      skinGrad.addColorStop(1, skinColor[2]);
      ctx.fillStyle = skinGrad;
      ctx.beginPath();
      ctx.arc(150, 150, 140, 0, Math.PI * 2);
      ctx.fill();

      // Eyebrows
      ctx.strokeStyle = '#3A2E2B'; ctx.lineWidth = 5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(85, 105); ctx.quadraticCurveTo(115, hairStyle === 'angry' ? 115 : 95, 140, 108); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(160, 108); ctx.quadraticCurveTo(185, hairStyle === 'angry' ? 115 : 95, 215, 105); ctx.stroke();

      // Eyes
      ctx.fillStyle = eyeColor;
      ctx.beginPath(); ctx.ellipse(110, 135, 18, 11, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(190, 135, 18, 11, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath(); ctx.arc(114, 132, 5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(194, 132, 5, 0, Math.PI * 2); ctx.fill();

      // Nose
      ctx.strokeStyle = '#D49E85'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(150, 135); ctx.lineTo(145, 175); ctx.lineTo(155, 178); ctx.stroke();

      // Lips
      ctx.strokeStyle = lipColor; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(150, 205, 22, 0.1, Math.PI - 0.1); ctx.stroke();

      const img = new Image();
      img.src = canvas.toDataURL('image/png');
      return img;
    }

    let fallbackUserFaceImg = new Image();
    fallbackUserFaceImg.src = 'images/face_preset_0.jpg';

    let localMediaStream = null;
    let isCameraPreviewing = true; // 最初はカメラプレビュー
    let vibesHistory = [];
    let vibesHistoryIndex = -1;

    // CSSだけで顔写真を歪ませるスタイル計算ロジック
    function getDistortionStyle(v) {
      const anger = v.anger || 0;
      const sadness = v.sadness || 0;
      const unfairness = v.unfairness || 0;
      const envy = v.envy || 0;
      const voidVal = v.void || 0;

      // 感情パラメータによる歪み計算
      const skewX = (anger * 0.35) + (unfairness * 0.2); 
      const skewY = (unfairness * 0.35) + (envy * 0.15); 
      const scale = 1.0 - (sadness * 0.002) - (voidVal * 0.001); 
      const rotate = (unfairness * 0.4) - (anger * 0.2); 

      // 色調変化
      let hue = 0;
      let saturate = 1.0;
      let contrast = 1.0;
      let grayscale = 0;
      let opacity = 1.0;

      if (anger > 20) {
        hue = -40 * (anger / 100);
        saturate = 1.0 + (anger / 40);
        contrast = 1.0 + (anger / 100);
      }
      if (sadness > 20) {
        hue = 180 * (sadness / 100);
        saturate = 1.0 + (sadness / 80);
      }
      if (envy > 20) {
        hue = 80 * (envy / 100);
        saturate = 1.0 + (envy / 40);
      }
      if (voidVal > 20) {
        grayscale = voidVal / 100;
        opacity = 1.0 - (voidVal * 0.006);
      }

      return `transform: rotate(${rotate}deg) skew(${skewX}deg, ${skewY}deg) scale(${scale}); filter: hue-rotate(${hue}deg) saturate(${saturate}) contrast(${contrast}) grayscale(${grayscale}) opacity(${opacity}); transition: transform 0.2s ease, filter 0.2s ease;`;
    }

    function startCamera(videoElement, onReady) {
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 480 }, height: { ideal: 480 } }, audio: false })
          .then(stream => {
            localMediaStream = stream;
            videoElement.srcObject = stream;
            videoElement.onloadedmetadata = () => {
              videoElement.play();
              onReady(true);
            };
          })
          .catch(err => {
            console.warn('Camera access error:', err);
            onReady(false);
          });
      } else {
        onReady(false);
      }
    }

    // カメラの停止
    function stopCamera() {
      if (localMediaStream) {
        localMediaStream.getTracks().forEach(t => t.stop());
        localMediaStream = null;
      }
    }

    function captureFacePhoto(videoElement) {
      const canvas = document.getElementById('captured-photo-canvas');
      if (!canvas || !videoElement) return null;

      const size = 300;
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      const rawW = videoElement.videoWidth || 300;
      const rawH = videoElement.videoHeight || 300;
      const cropSize = Math.min(rawW, rawH);
      const cropX = (rawW - cropSize) / 2;
      const cropY = (rawH - cropSize) / 2;

      ctx.translate(size, 0);
      ctx.scale(-1, 1);
      
      ctx.beginPath();
      ctx.arc(size/2, size/2, size/2, 0, Math.PI * 2);
      ctx.clip();
      
      ctx.drawImage(videoElement, cropX, cropY, cropSize, cropSize, 0, 0, size, size);

      const dataUrl = canvas.toDataURL('image/png');
      const img = new Image();
      img.src = dataUrl;
      capturedPhotoImg = img;
      return dataUrl;
    }



    function pushVibesHistory() {
      const copy = { ...vibes };
      if (vibesHistoryIndex < vibesHistory.length - 1) {
        vibesHistory = vibesHistory.slice(0, vibesHistoryIndex + 1);
      }
      vibesHistory.push(copy);
      vibesHistoryIndex = vibesHistory.length - 1;
    }

    function undoVibes() {
      if (vibesHistoryIndex > 0) {
        vibesHistoryIndex--;
        vibes = { ...vibesHistory[vibesHistoryIndex] };
        updateSlidersAndFace();
      }
    }

    function redoVibes() {
      if (vibesHistoryIndex < vibesHistory.length - 1) {
        vibesHistoryIndex++;
        vibes = { ...vibesHistory[vibesHistoryIndex] };
        updateSlidersAndFace();
      }
    }

    function updateSlidersAndFace() {
      const keys = ['anger', 'sadness', 'unfairness', 'envy', 'void'];
      keys.forEach(key => {
        const input = document.getElementById(`slider-${key}`);
        if (input) input.value = vibes[key];
        const valSpan = document.getElementById(`val-${key}`);
        if (valSpan) valSpan.innerText = vibes[key];
      });
      const faceImg = document.getElementById('vibe-face-preview-img');
      if (faceImg) {
        faceImg.style.cssText = getDistortionStyle(vibes);
      }
    }

    function drawPolaApexMeshDistortedFace(canvas, vibesData, showMetrics = true, customPhotoImg = null) {
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const width = canvas.width;
      const height = canvas.height;
      const cx = width / 2;
      const cy = height / 2 - (showMetrics ? 10 : 0);

      ctx.clearRect(0, 0, width, height);

      const activePhoto = customPhotoImg || capturedPhotoImg || fallbackUserFaceImg;

      if (activePhoto && (activePhoto.complete || activePhoto.width > 0)) {
        const radiusMax = width * (showMetrics ? 0.32 : 0.44);
        const rSize = radiusMax * 2.3;
        
        ctx.save();
        // 歪まずにきれいに中央に描画します
        ctx.drawImage(activePhoto, cx - rSize / 2, cy - rSize / 2, rSize, rSize);
        ctx.restore();
      }
    }

    function drawTexturedTriangle(ctx, img, s, d) {
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(d[0].x, d[0].y);
      ctx.lineTo(d[1].x, d[1].y);
      ctx.lineTo(d[2].x, d[2].y);
      ctx.closePath();
      ctx.clip();

      const x0 = s[0].x, y0 = s[0].y;
      const x1 = s[1].x, y1 = s[1].y;
      const x2 = s[2].x, y2 = s[2].y;

      const u0 = d[0].x, v0 = d[0].y;
      const u1 = d[1].x, v1 = d[1].y;
      const u2 = d[2].x, v2 = d[2].y;

      const delta = (x1 - x0) * (y2 - y0) - (x2 - x0) * (y1 - y0);
      if (Math.abs(delta) < 0.0001) {
        ctx.restore();
        return;
      }

      const deltaU1 = u1 - u0, deltaU2 = u2 - u0;
      const deltaV1 = v1 - v0, deltaV2 = v2 - v0;

      const a = (deltaU1 * (y2 - y0) - deltaU2 * (y1 - y0)) / delta;
      const b = (deltaV1 * (y2 - y0) - deltaV2 * (y1 - y0)) / delta;
      const c = (deltaU2 * (x1 - x0) - deltaU1 * (x2 - x0)) / delta;
      const dVal = (deltaV2 * (x1 - x0) - deltaV1 * (x2 - x0)) / delta;
      const e = u0 - a * x0 - c * y0;
      const f = v0 - b * x0 - dVal * y0;

      ctx.transform(a, b, c, dVal, e, f);
      ctx.drawImage(img, 0, 0);
      ctx.restore();
    }

    // レーダーチャートのポリゴン計算（DOMが整ってから実行）
    function updateRadarPolygon() {
      const polygon = document.getElementById('radar-polygon');
      if (!polygon) return;
      const r = 120;
      const v = vibes;
      const vals = [
        v.envy / 100,
        v.unfairness / 100,
        v.anger / 100,
        v.sadness / 100,
      ];
      const angles = [
        -Math.PI/2,
        -Math.PI/2 + Math.PI/2,
        -Math.PI/2 + Math.PI,
        -Math.PI/2 + 3*Math.PI/2,
      ];
      const pts = vals.map((val, i) => {
        const dist = val * r;
        return `${(dist * Math.cos(angles[i])).toFixed(1)},${(dist * Math.sin(angles[i])).toFixed(1)}`;
      });
      polygon.setAttribute('points', pts.join(' '));
    }

    // --- 本格🔥絵文字の全画面ダイナミック火炎物理シミュレーション (3秒間持続・ゆらゆら直進上昇) ---
    function triggerRealFireBurnSimulation(onComplete) {
      const canvas = document.getElementById('real-fire-canvas');
      if (!canvas) {
        onComplete();
        return;
      }

      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const ctx = canvas.getContext('2d');

      soundEngine.playSoftBurn();
      canvas.classList.add('active');

      let particles = [];
      const particleCount = 85;

      for (let i = 0; i < particleCount; i++) {
        particles.push({
          startX: Math.random() * canvas.width,
          x: Math.random() * canvas.width,
          y: canvas.height + Math.random() * 200,
          vy: -(Math.random() * 6 + 4),
          size: Math.floor(Math.random() * 45 + 20),
          rotation: (Math.random() - 0.5) * 0.3,
          rotSpeed: (Math.random() - 0.5) * 0.03,
          opacity: Math.random() * 0.5 + 0.5,
          swayFreq: Math.random() * 0.006 + 0.003,
          swayAmp: Math.random() * 18 + 8
        });
      }

      let animId;
      let startTime = performance.now();

      function loop(now) {
        const elapsed = (now - startTime) / 1000;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 背景の半透明暗転
        ctx.fillStyle = 'rgba(0, 0, 0, 0.22)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        particles.forEach(p => {
          // 左右に優しくゆらゆら揺れながら、まっすぐ上空へ立ち上る（斜め傾きなし）
          p.x = p.startX + Math.sin(now * p.swayFreq + p.y * 0.005) * p.swayAmp;
          p.y += p.vy;

          // 画面外に抜けたら下部からループ再生（3秒間途切れず燃え続ける）
          if (p.y < -80 && elapsed < 2.5) {
            p.y = canvas.height + Math.random() * 60;
            p.startX = Math.random() * canvas.width;
          }

          if (p.y > -100) {
            ctx.save();
            ctx.globalAlpha = Math.max(0, Math.min(1, p.opacity));
            ctx.translate(p.x, p.y);
            ctx.font = `${p.size}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🔥', 0, 0);
            ctx.restore();
          }
        });

        if (elapsed < 3.0) {
          animId = requestAnimationFrame(loop);
        }
      }

      animId = requestAnimationFrame(loop);

      setTimeout(() => {
        onComplete();
        setTimeout(() => {
          cancelAnimationFrame(animId);
          canvas.classList.remove('active');
        }, 300);
      }, 2700);
    }

    function closeModalWithAnimation() {
      const modalSheet = document.getElementById('modal-sheet');

    // --- イベントリスナー ---

            undoVibes();

      const toBurnBtn = document.getElementById('btn-to-burn-step');

        toBurnBtn.onclick = () => {
          soundEngine.playSubtleClick();
          currentStep = 'solo_burn';

      const rantArea = document.getElementById('rant-textarea');
      if (rantArea) {

      document.querySelectorAll('.tag-btn').forEach(btn => {
        btn.onclick = (e) => {

          if (selectedTags.includes(tag)) {

              selectedTags = selectedTags.filter(t => t !== tag);

          renderApp();

      const executeBurnBtn = document.getElementById('btn-execute-burn');
      if (executeBurnBtn) {
        executeBurnBtn.onclick = () => {
          const textarea = document.getElementById('rant-textarea');
          const val = textarea ? textarea.value.trim() : rantText.trim();
          if (!val) return;

          triggerRealFireBurnSimulation(() => {
            const instantReplies = generateContextualSympatheticEnjoReplies(val);

              id: `post-${Date.now()}-${Math.floor(Math.random()*1000)}`,

              userId: '@my_otakiage',
              dateStr: 'たった今',

              gasshoCount: 1,

              replies: instantReplies
            };

            posts.unshift(newPost);
            
            // クラウド上の共有データベース (kvdb.io) へ書き込んで即時同期
            syncPushToCloudDatabase(newPost);

            rantText = '';

            currentStep = 'chaos_gallery';
            renderApp();
          });
        };
      }

      // X(旧Twitter)風タイムラインカードタップでダイレクトに投稿詳細モーダルをオープン
      document.querySelectorAll('.post-item-card').forEach(card => {
        card.onclick = (e) => {
          if (e.target.closest('.btn-gassho')) return;
          const postId = card.dataset.postid;
          const post = posts.find(p => p.id === postId);
          if (post) {
            selectedPostModal = post;
            soundEngine.playSubtleClick();
            renderApp();
          }
        };
      });

      const modalSheet = document.getElementById('modal-sheet');
      const modalBackdrop = document.getElementById('modal-backdrop');
      const dragHandle = document.getElementById('modal-drag-handle');

      if (modalSheet && dragHandle) {
        let sheetTouchStartY = 0;
        let isDragging = false;

        dragHandle.onclick = () => {
          soundEngine.playSubtleClick();
          closeModalWithAnimation();
        };

        dragHandle.ontouchstart = (e) => {
          sheetTouchStartY = e.touches[0].clientY;
          isDragging = true;
        };

        dragHandle.ontouchmove = (e) => {
          if (!isDragging) return;
          const currentY = e.touches[0].clientY;
          const diffY = currentY - sheetTouchStartY;
          if (diffY > 0) {
            modalSheet.style.transform = `translateY(${diffY}px)`;
          }
        };

        dragHandle.ontouchend = (e) => {
          isDragging = false;
          const currentY = e.changedTouches[0].clientY;
          const diffY = currentY - sheetTouchStartY;
          if (diffY > 40) {
            closeModalWithAnimation();
          } else {
            modalSheet.style.transform = 'translateY(0)';
          }
        };

        modalBackdrop.onclick = (e) => {
          if (e.target === modalBackdrop) {
            closeModalWithAnimation();
          }
        };
      }

      // コメント入力・即時反映
      const submitReplyBtn = document.getElementById('btn-submit-reply');
      if (submitReplyBtn && selectedPostModal) {
        const handleReplySubmit = () => {
          const input = document.getElementById('modal-reply-input');
          if (input && input.value.trim()) {
            const newReplyText = input.value.trim();
            if (!selectedPostModal.replies) selectedPostModal.replies = [];
            
            const newReplyObj = {
              name: 'あなた',
              handle: '@you',
              text: newReplyText
            };

            selectedPostModal.replies.unshift(newReplyObj);
            input.value = '';
            soundEngine.playSubtleClick();

            // クラウド共有データベースへコメント追加後の投稿データを更新
            syncPushToCloudDatabase(selectedPostModal);

            const listContainer = document.getElementById('modal-replies-list');
            if (listContainer) {
              const replyDiv = document.createElement('div');
              replyDiv.className = 'bg-paper border border-paper-border p-3 rounded-2xl text-xs hover:border-zinc-300 transition-colors fade-in';
              replyDiv.innerHTML = `
                <div class="flex items-center justify-between mb-1">
                  <span class="font-bold text-zinc-900 text-[11px]">あなた</span>
                  <span class="text-[9px] text-zinc-400 font-mono">@you</span>
                </div>
                <p class="text-zinc-800 font-medium text-[11px] leading-relaxed break-words">${newReplyText}</p>
              `;
              listContainer.insertBefore(replyDiv, listContainer.firstChild);
              listContainer.scrollTop = 0;
            } else {
              renderApp();
            }
          }
        };

        submitReplyBtn.onclick = handleReplySubmit;

        const replyInput = document.getElementById('modal-reply-input');

          replyInput.onkeypress = (e) => {

      const navChaos = document.getElementById('nav-chaos');
      if (navChaos) {
        navChaos.onclick = () => { currentStep = 'chaos_gallery'; soundEngine.playSubtleClick(); renderApp(); };
      }

      const navCreateBurn = document.getElementById('nav-create-burn');
      if (navCreateBurn) {
        navCreateBurn.onclick = () => {
          soundEngine.playSubtleClick();
          currentStep = 'solo_burn';
          renderApp();
        };
      }

      const navProfile = document.getElementById('nav-profile');
      if (navProfile) {
        navProfile.onclick = () => { currentStep = 'profile'; soundEngine.playSubtleClick(); renderApp(); };
      }

      document.querySelectorAll('.btn-gassho').forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          const postId = e.currentTarget.dataset.postid;
          soundEngine.playGasshoBell();

          const post = posts.find(p => p.id === postId);
          if (post) {
            post.gasshoCount += 1;
            burnStats.gasshoGiven += 1;

            const countSpan = document.getElementById(`gassho-count-${postId}`);
            if (countSpan) countSpan.innerText = post.gasshoCount;

            // 🙏ボタンが10回押される（または10の倍数に達する）たびに、その投稿欄だけメラメラ炎上
            if (post.gasshoCount % 10 === 0) {
              soundEngine.playSoftBurn();
              const overlay = document.getElementById(`enjo-flame-overlay-${postId}`);
              const cardElem = document.getElementById(`card-item-${postId}`);
              
              if (overlay) {
                overlay.style.opacity = '1';
                if (cardElem) cardElem.classList.add('bg-amber-50');

                // 本格全画面火炎物理シミュレーションも同時発動
                triggerRealFireBurnSimulation(() => {});

                setTimeout(() => {
                  overlay.style.opacity = '0';
                  if (cardElem) cardElem.classList.remove('bg-amber-50');
                }, 2000);
              }
            }
          }
        };
      });

      const recreateBtn = document.getElementById('btn-recreate-vibe');

        recreateBtn.onclick = () => {
          currentStep = 'vibe_check';
          renderApp();

    // モバイルブラウザでのピンチズーム・ダブルタップ拡大防止
    document.addEventListener('gesturestart', function(e) {
      e.preventDefault();
    }, { passive: false });

    let lastTouchEnd = 0;
    document.addEventListener('touchend', function(e) {
      const now = (new Date()).getTime();
      if (now - lastTouchEnd <= 300) {
        e.preventDefault();
      }
      lastTouchEnd = now;
    }, { passive: false });

    // 共有リアルタイムデータベース (KVDB.ioを用いたサーバーレス型匿名データ共有)
    const KVDB_URL = 'https://kvdb.io/4y9W8p9H2M9Q2S9X2Z2A2B/otakiage_posts_v2';

    async function syncPushToCloudDatabase(singlePostOrUpdatedPost) {
      try {
        const localList = [...posts];
        const cleanList = localList.map(p => ({
          id: p.id,
          userName: p.userName,
          userId: p.userId,
          dateStr: p.dateStr,
          text: p.text,
          authorVibe: p.authorVibe,
          customPhotoData: p.customPhotoData || '',
          gasshoCount: p.gasshoCount || 0,
          tag: p.tag,
          replies: p.replies || []
        }));

        await fetch(KVDB_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(cleanList)
        });
      } catch (err) {
        console.warn('Realtime database push error:', err);
      }
    }

    async function fetchFromCloudDatabase() {
      try {
        const res = await fetch(KVDB_URL);
        if (res.ok) {
          const cloudPosts = await res.json();
          if (Array.isArray(cloudPosts) && cloudPosts.length > 0) {
            cloudPosts.forEach(cp => {
              const exists = posts.some(p => p.id === cp.id);
              if (!exists) {
                posts.unshift(cp);
              } else {
                const target = posts.find(p => p.id === cp.id);
                if (target && cp.replies && cp.replies.length > (target.replies || []).length) {
                  target.replies = cp.replies;
                }
              }
            });
            posts = posts.filter((p, index, self) =>
              index === self.findIndex((t) => t.id === p.id)
            );
            return true;
          }
        }
      } catch (err) {
        console.warn('Realtime database fetch error:', err);
      }
      return false;
    }

    window.onload = async function() {
      renderApp();

      // 初回ロード時にクラウド上の共有データを読み込む
      await fetchFromCloudDatabase();
      renderApp();

      // リアルタイムデータベースとのクラウド自動同期周期 (5秒ごと)
      setInterval(async () => {
        const updated = await fetchFromCloudDatabase();
        if (updated && currentStep === 'chaos_gallery' && !selectedPostModal) {
          renderApp();
        }
      }, 5000);

      // 他のユーザーが打ち込んだお焚き上げもリアルタイムで更新されるようにするスケジューラー (8秒ごと)
      setInterval(() => {
        // バックグラウンドで新規投稿をタイムラインの最上部に生成して挿入
        const sampleText = pastRantSamples[Math.floor(Math.random() * pastRantSamples.length)];
        const tags = ['#仕事', '#人間関係', '#自分', '#社会', '#恋愛'];
        const tag1 = tags[Math.floor(Math.random() * tags.length)];
        const u = viralUserNames[Math.floor(Math.random() * viralUserNames.length)];
        
        const newPost = {
          id: `post-gen-realtime-${Date.now()}`,
          userName: u.name,
          userId: `${u.handle}_${postIndexCount}`,
          dateStr: 'たった今',
          text: sampleText,
          authorVibe: {
            anger: Math.floor(Math.random() * 80 + 20),
            sadness: Math.floor(Math.random() * 80 + 20),
            unfairness: Math.floor(Math.random() * 80 + 20),
            envy: Math.floor(Math.random() * 80 + 20),
            void: Math.floor(Math.random() * 80 + 20)
          },
          gasshoCount: Math.floor(Math.random() * 5 + 1),
          tag: tag1,
          replies: generateContextualSympatheticEnjoReplies(sampleText)
        };
        
        posts.unshift(newPost);
        postIndexCount++;

        // 掲示板画面を表示中の場合のみ、画面のタイムライン表示を即座に再レンダリングする
        if (currentStep === 'chaos_gallery' && !selectedPostModal) {
          renderApp();
        }
      }, 8000);
    };
