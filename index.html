          console.error(e);

        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          const ctx = new AudioCtx();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, ctx.currentTime);
          gain.gain.setValueAtTime(0.04, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.03);

          gain.connect(ctx.destination);
          osc.start();

    // --- 歪み顔描画 ---
    function drawMinimalDistortedFace(canvas, vibesData, showMetrics = true) {
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const width = canvas.width;
      const height = canvas.height;
      const cx = width / 2;
      const cy = height / 2;

      ctx.clearRect(0, 0, width, height);

      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, width, height);

      const radiusMax = width * 0.36;
      ctx.strokeStyle = '#EBEBEF';
      ctx.lineWidth = 1;
      [0.25, 0.5, 0.75, 1.0].forEach(r => {
        ctx.beginPath();
        ctx.arc(cx, cy, radiusMax * r, 0, Math.PI * 2);
        ctx.stroke();
      });

      const angles = [
        -Math.PI / 2,
        -Math.PI / 2 + (Math.PI * 2 / 5),
        -Math.PI / 2 + (Math.PI * 4 / 5),
        -Math.PI / 2 + (Math.PI * 6 / 5),
        -Math.PI / 2 + (Math.PI * 8 / 5)
      ];

      ctx.strokeStyle = '#F0F0F4';
      angles.forEach(a => {
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(a) * radiusMax, cy + Math.sin(a) * radiusMax);
        ctx.stroke();
      });

      const anger = (vibesData.anger || 50) / 100;
      const sadness = (vibesData.sadness || 50) / 100;
      const unfairness = (vibesData.unfairness || 50) / 100;
      const envy = (vibesData.envy || 50) / 100;
      const voidVal = (vibesData.void || 50) / 100;

      const vibeValues = [anger, unfairness, voidVal, envy, sadness];

      ctx.beginPath();
      const numPoints = 15;
      for (let i = 0; i < numPoints; i++) {
        const theta = (i / numPoints) * Math.PI * 2 - Math.PI / 2;
        const sector = (theta + Math.PI / 2 + Math.PI * 2) % (Math.PI * 2);
        const sectorIdx = Math.floor(sector / (Math.PI * 2 / 5)) % 5;
        const nextSectorIdx = (sectorIdx + 1) % 5;
        const ratio = (sector % (Math.PI * 2 / 5)) / (Math.PI * 2 / 5);

        const currentVibe = vibeValues[sectorIdx];
        const nextVibe = vibeValues[nextSectorIdx];
        const interpolatedVibe = currentVibe * (1 - ratio) + nextVibe * ratio;

        let spike = (i % 3 === 0) ? (1 + interpolatedVibe * 0.4) : (0.85 + interpolatedVibe * 0.2);
        let r = (width * 0.18) + (radiusMax * 0.55 * interpolatedVibe * spike);

        const px = cx + Math.cos(theta) * r;
        const py = cy + Math.sin(theta) * r;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fillStyle = '#FAFAFA';
      ctx.fill();
      ctx.strokeStyle = '#111111';
      ctx.lineWidth = 2;
      ctx.stroke();

      const eyeDroop = sadness * 10;
      const eyeStretchX = envy * 12;
      const mouthContort = (anger * 14) - (voidVal * 10);
      const headR = width * 0.2;

      // 左目
      ctx.save();
      ctx.translate(cx - headR * 0.4 - eyeStretchX / 2, cy - headR * 0.15 + eyeDroop);
      ctx.rotate((sadness - anger) * 0.3);
      ctx.beginPath();
      ctx.ellipse(0, 0, Math.max(3.5, 9 + eyeStretchX * 0.5), Math.max(2, 5 + anger * 5), 0, 0, Math.PI * 2);
      ctx.fillStyle = '#111111'; ctx.fill();
      ctx.beginPath();
      ctx.arc((envy - 0.5) * 4, (unfairness - 0.5) * 3, 2, 0, Math.PI * 2);
      ctx.fillStyle = '#FFFFFF'; ctx.fill();
      ctx.restore();

      // 右目
      ctx.save();
      ctx.translate(cx + headR * 0.38 + eyeStretchX / 3, cy - headR * 0.15 - eyeDroop / 2);
      ctx.rotate((anger - sadness) * 0.35);
      ctx.beginPath();
      ctx.ellipse(0, 0, Math.max(3.5, 8.5 + anger * 8), Math.max(2, 5.5 + sadness * 4.5), 0.12, 0, Math.PI * 2);
      ctx.fillStyle = '#111111'; ctx.fill();
      ctx.beginPath();
      ctx.arc((0.5 - envy) * 4, (0.5 - anger) * 4, 2, 0, Math.PI * 2);
      ctx.fillStyle = '#FFFFFF'; ctx.fill();
      ctx.restore();

      // 鼻
      ctx.beginPath();
      ctx.moveTo(cx, cy - 4);
      ctx.lineTo(cx - (unfairness - 0.5) * 10, cy + headR * 0.18);
      ctx.strokeStyle = '#777777';
      ctx.lineWidth = 1;
      ctx.stroke();

      // 口
      ctx.beginPath();
      const mouthY = cy + headR * 0.36;
      ctx.moveTo(cx - 13 - envy * 5, mouthY + mouthContort);
      ctx.quadraticCurveTo(
        cx, mouthY - mouthContort * 1.1 + (sadness * 12),
        cx + 13 + anger * 9, mouthY - mouthContort
      );
      ctx.strokeStyle = '#111111';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.beginPath();
      vibeValues.forEach((v, idx) => {
        const a = angles[idx];
        const r = radiusMax * (0.25 + v * 0.75);
        const px = cx + Math.cos(a) * r;
        const py = cy + Math.sin(a) * r;
        if (idx === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      });
      ctx.closePath();
      ctx.fillStyle = 'rgba(17, 17, 17, 0.04)';
      ctx.fill();
      ctx.strokeStyle = '#111111';
      ctx.lineWidth = 1;
      ctx.stroke();

      if (showMetrics) {
        ctx.fillStyle = '#111111';
        ctx.font = '700 10px "Noto Sans JP", sans-serif';

        const labelPos = [
          { text: 'flowy', x: cx, y: cy - radiusMax - 10, align: 'center' },
          { text: 'deep', x: cx + radiusMax + 14, y: cy - 6, align: 'left' },
          { text: 'edgy', x: cx + radiusMax * 0.65, y: cy + radiusMax + 14, align: 'left' },
          { text: 'playful', x: cx - radiusMax * 0.65, y: cy + radiusMax + 14, align: 'right' },
          { text: 'moody', x: cx - radiusMax - 14, y: cy - 6, align: 'right' },
        ];

        labelPos.forEach(l => {
          ctx.textAlign = l.align;
          ctx.fillText(l.text, l.x, l.y);
        });
      }
    }

    // --- 体感4秒のじわじわ炎上アニメーション ---
    function triggerRealisticFireTransition(onComplete) {
      const fireCanvas = document.getElementById('fire-canvas');
      if (!fireCanvas) {
        onComplete();
        return;
      }

      fireCanvas.classList.remove('hidden');
      fireCanvas.width = window.innerWidth;
      fireCanvas.height = window.innerHeight;
      const ctx = fireCanvas.getContext('2d');

      let flames = [];
      for (let i = 0; i < 300; i++) {
        flames.push({
          x: Math.random() * fireCanvas.width,
          y: fireCanvas.height + Math.random() * 80,
          vx: (Math.random() - 0.5) * 2,
          vy: -Math.random() * 6 - 3,
          radius: Math.random() * 55 + 30,
          life: 0,
          maxLife: Math.random() * 100 + 80,
          hue: Math.floor(Math.random() * 30)
        });
      }

      soundEngine.playSoftBurn();

      let progress = 0;
      const durationFrames = 220;
      let frame = 0;

      function drawSlowFlameFrame() {
        frame++;
        progress = frame / durationFrames;

        ctx.fillStyle = `rgba(255, 255, 255, ${Math.min(0.12, progress * 0.15)})`;
        ctx.fillRect(0, 0, fireCanvas.width, fireCanvas.height);

        const flameHeight = Math.min(fireCanvas.height * 1.3, progress * fireCanvas.height * 1.6);
        const grad = ctx.createLinearGradient(0, fireCanvas.height, 0, Math.max(0, fireCanvas.height - flameHeight));
        grad.addColorStop(0, 'rgba(255, 30, 0, 0.95)');
        grad.addColorStop(0.4, 'rgba(255, 100, 0, 0.85)');
        grad.addColorStop(0.7, 'rgba(255, 200, 0, 0.7)');
        grad.addColorStop(1, 'rgba(255, 255, 255, 0)');

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(0, fireCanvas.height);
        for (let x = 0; x <= fireCanvas.width; x += 25) {
          const wave = Math.sin(x * 0.02 + progress * 8) * 30 + Math.cos(x * 0.04 - progress * 6) * 20;
          ctx.lineTo(x, fireCanvas.height - flameHeight + wave);
        }
        ctx.lineTo(fireCanvas.width, fireCanvas.height);
        ctx.closePath();
        ctx.fill();

        flames.forEach(f => {
          f.x += f.vx + Math.sin(f.life * 0.08) * 1.2;
          f.y += f.vy;
          f.life++;

          const alpha = Math.max(0, 1 - f.life / f.maxLife);
          const rad = f.radius * (1 - f.life / f.maxLife * 0.4);

          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          const pGrad = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, Math.max(1, rad));
          pGrad.addColorStop(0, `hsla(${f.hue}, 100%, 75%, ${alpha})`);
          pGrad.addColorStop(0.5, `hsla(${f.hue}, 100%, 50%, ${alpha * 0.6})`);
          pGrad.addColorStop(1, `hsla(${f.hue}, 100%, 20%, 0)`);

          ctx.fillStyle = pGrad;
          ctx.beginPath();
          ctx.arc(f.x, f.y, Math.max(1, rad), 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          if (f.life >= f.maxLife) {
            f.x = Math.random() * fireCanvas.width;
            f.y = fireCanvas.height + Math.random() * 40;
            f.life = 0;
          }
        });

        if (frame < durationFrames) {
          requestAnimationFrame(drawSlowFlameFrame);
        } else {
          ctx.fillStyle = 'rgba(255, 255, 255, 1)';
          ctx.fillRect(0, 0, fireCanvas.width, fireCanvas.height);

          onComplete();

          const root = document.getElementById('app-root');
          if (root) {
            root.classList.add('slide-up-enter');
            setTimeout(() => root.classList.remove('slide-up-enter'), 800);
          }

          setTimeout(() => {
            fireCanvas.classList.add('hidden');
            ctx.clearRect(0, 0, fireCanvas.width, fireCanvas.height);
          }, 200);
        }
      }

      drawSlowFlameFrame();
    }

          vibes[key] = val;

          soundEngine.playSubtleClick();

          const faceCanvas = document.getElementById('vibe-face-canvas');
          if (faceCanvas) {
            drawMinimalDistortedFace(faceCanvas, vibes, true);
          }
        };
      });

      // STEP 1 -> STEP 2
      const toBurnBtn = document.getElementById('btn-to-burn-step');
      if (toBurnBtn) {
        toBurnBtn.onclick = () => {
          soundEngine.playSubtleClick();
          currentStep = 'solo_burn';
          renderApp();
        };
      }

      // リアルタイム文字数制限 (200文字)
      const rantArea = document.getElementById('rant-textarea');
      if (rantArea) {
        rantArea.oninput = (e) => {
          rantText = e.target.value;
          const charCountSpan = document.getElementById('char-count');
          if (charCountSpan) {
            charCountSpan.innerText = rantText.length;
          }
        };
      }

      // ハッシュタグ複数選択
      document.querySelectorAll('.tag-btn').forEach(btn => {
        btn.onclick = (e) => {
          const tag = e.currentTarget.dataset.tag;
          if (selectedTags.includes(tag)) {
            if (selectedTags.length > 1) {
              selectedTags = selectedTags.filter(t => t !== tag);
            }
          } else {
            selectedTags.push(tag);
          }
          soundEngine.playSubtleClick();
          renderApp();
        };
      });

      // ハッシュタグ自由追加
      const addTagBtn = document.getElementById('btn-add-tag');
      if (addTagBtn) {
        addTagBtn.onclick = () => {
          const input = document.getElementById('new-tag-input');
          if (input && input.value.trim()) {
            let val = input.value.trim();
            if (!val.startsWith('#')) val = '#' + val;
            if (!categoryTags.includes(val)) {
              categoryTags.push(val);
              selectedTags.push(val);
              soundEngine.playSubtleClick();
              renderApp();
            }
          }
        };
      }

      // STEP 2 -> STEP 3 (自分の投稿即時大量炎上レス生成)
      const executeBurnBtn = document.getElementById('btn-execute-burn');
      if (executeBurnBtn) {
        executeBurnBtn.onclick = () => {
          const textarea = document.getElementById('rant-textarea');
          const val = textarea ? textarea.value.trim() : rantText.trim();
          if (!val) return;

          triggerRealisticFireTransition(() => {
            // 自分の投稿直後に即座に大量のリアル炎上レス（8〜10件）がぶら下がる
            const instantEnjoReplies = [
              { name: '裏アカウント@拡散希望', handle: '@ura_kakukan_01', text: 'こいつ最低だな。拡散します。' },
              { name: '名無しさん@お腹いっぱい', handle: '@nanashi_2ch_99', text: '完全に燃えてて草。反省してなさそう' },
              { name: '通りすがりの特定班', handle: '@tokutei_expert', text: '関係者はどう思ってるんだ？責任取れよ' },
              { name: '物申す人', handle: '@monomosu_man', text: 'これマジで言ってる？人としてあり得ないだろ' },
              { name: '激辛レビュアー', handle: '@gekikara_sub', text: '特定班仕事早くて草。まとめサイト載るなこれ' },
              { name: '知恵袋回答者', handle: '@chiebukuro_master', text: '社会的にアウト。全員で晒していこうぜｗｗｗ' },
              { name: 'ウォッチ民', handle: '@watch_sub', text: '即炎上しててワロタｗｗｗｗｗｗ' },
              { name: '炎上まとめ速報', handle: '@enjo_news', text: '【速報】またヤバい投稿が発見されるｗｗｗ' }
            ];

            posts.unshift({
              id: `post-${Date.now()}`,
              userName: 'あなたのお焚き上げ',
              userId: '@my_otakiage',
              dateStr: 'たった今',
              text: val,
              authorVibe: { ...vibes },
              gasshoCount: 1,
              tag: selectedTags.join(' '),
              replies: instantEnjoReplies
            });

            burnStats.totalBurned += 1;
            rantText = '';

            currentStep = 'chaos_gallery';
            renderApp();
          });
        };
      }

      // ポストタップで炎上モーダルを開く
      document.querySelectorAll('.post-item-card').forEach(card => {
        card.onclick = (e) => {
          if (e.target.closest('.btn-gassho')) return;
          const postId = card.dataset.postid;
          const post = posts.find(p => p.id === postId);
          if (post) {
            selectedPostModal = post;
            soundEngine.playSubtleClick();
            renderApp();
          }
        };
      });

      // モーダル閉じる
      const closeModalBtn = document.getElementById('btn-close-modal');
      if (closeModalBtn) {
        closeModalBtn.onclick = () => {
          selectedPostModal = null;
          renderApp();
        };
      }

      // モーダル内で追撃コメント追加
      const submitReplyBtn = document.getElementById('btn-submit-reply');
      if (submitReplyBtn && selectedPostModal) {
        submitReplyBtn.onclick = () => {
          const input = document.getElementById('modal-reply-input');
          if (input && input.value.trim()) {
            if (!selectedPostModal.replies) selectedPostModal.replies = [];
            selectedPostModal.replies.push({
              name: '名無しさん@追撃',
              handle: '@enjo_chaser',
              text: input.value.trim()
            });
            input.value = '';
            soundEngine.playSubtleClick();
            renderApp();
          }
        };
      }

      // ボトムナビボタン
      const navChaos = document.getElementById('nav-chaos');
      if (navChaos) {
        navChaos.onclick = () => { currentStep = 'chaos_gallery'; soundEngine.playSubtleClick(); renderApp(); };
      }
      const navProfile = document.getElementById('nav-profile');
      if (navProfile) {
        navProfile.onclick = () => { currentStep = 'profile'; soundEngine.playSubtleClick(); renderApp(); };
      }

      document.querySelectorAll('.btn-gassho').forEach(btn => {
        btn.onclick = (e) => {
          const postId = e.currentTarget.dataset.postid;
          soundEngine.playGasshoBell();

          const post = posts.find(p => p.id === postId);
          if (post) {
            post.gasshoCount += 1;
            burnStats.gasshoGiven += 1;

            const countSpan = document.getElementById(`gassho-count-${postId}`);
            if (countSpan) countSpan.innerText = post.gasshoCount;
          }
        };
      });

      const recreateBtn = document.getElementById('btn-recreate-vibe');
      if (recreateBtn) {
        recreateBtn.onclick = () => {
          currentStep = 'vibe_check';
          renderApp();
        };
      }
    }

    window.onload = function() {
      renderApp();
    };
  </script>
</body>
</html>
