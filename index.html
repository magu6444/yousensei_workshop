  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      box-shadow: none !important;
      font-family: 'LINE Seed Sans', 'LINE Seed JP', sans-serif !important;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      background-color: #FFFFFF;
      color: #0F1419;
      font-family: 'LINE Seed Sans', 'LINE Seed JP', sans-serif !important;
      overflow-x: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      touch-action: pan-x pan-y;
      -webkit-text-size-adjust: 100%;
    }

    body.no-scroll {
      overflow-y: hidden;
      touch-action: none;
    }

    /* 全画面最前面レイヤー：上部（アセット 3）＆ 下部（アセット 4）牙フレーム */
    .app-top-teeth-frame {
      position: fixed;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      width: 100vw;
      max-width: 448px;
      height: auto;
      z-index: 9999;
      pointer-events: none;
      display: none;
      transition: transform 0.75s cubic-bezier(0.77, 0, 0.175, 1);
    }

    .app-bottom-teeth-frame {
      position: fixed;
      bottom: -14px;
      left: 50%;
      transform: translateX(-50%);
      width: 100vw;
      max-width: 448px;
      height: auto;
      z-index: 9999;
      pointer-events: none;
      display: none;
      transition: transform 0.75s cubic-bezier(0.77, 0, 0.175, 1);
    }

    /* タイトル画面のみ牙フレームを表示 */
    body.is-intro .app-top-teeth-frame,
    body.is-intro .app-bottom-teeth-frame {
      display: block;
    }

    /* 牙がガツンと噛み合うアグレッシブなアニメーション */
    .app-top-teeth-frame.bite-snap {
      transform: translateX(-50%) translateY(45%);
    }

    .app-bottom-teeth-frame.bite-snap {
      transform: translateX(-50%) translateY(-45%);
    }

    /* 噛み合った後にガバッと上下に開いて画面外へ全開逃走 */
    .app-top-teeth-frame.open-wide {
      transform: translateX(-50%) translateY(-120%);
    }

    .app-bottom-teeth-frame.open-wide {
      transform: translateX(-50%) translateY(120%);
    }

    /* 全画面ジャストフィット用コンテナ */
    .screen-container {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100dvh;
      padding-top: max(7.0rem, calc(env(safe-area-inset-top) + 6.0rem));
      padding-bottom: max(4.5rem, calc(env(safe-area-inset-bottom) + 3.5rem));
      padding-left: 1.25rem;
      padding-right: 1.25rem;
      overflow: hidden;
    }

    /* ポスタータイトルの縦列整列 ＆ 行間詰めつつ16vwの最適サイズで画面中央やや下寄りに配置 */
    .poster-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      row-gap: 0.15rem;
      column-gap: -7px;
      width: 100%;
      max-width: 245px;
      margin: 0 auto;
    }

    .poster-cell {
      display: flex;
      align-items: center;
      justify-content: center;
      height: auto;
      aspect-ratio: 1;
    }

    .poster-char {
      font-weight: 400 !important;
      font-size: 16vw;
      color: #111111;
      font-family: 'LINE Seed Sans', 'LINE Seed JP', sans-serif !important;
      line-height: 1;
      text-align: center;
      display: inline-block;
      transform: scaleX(0.65);
      transform-origin: center center;
    }

    @media (min-width: 500px) {
      .poster-char {
        font-size: 4.6rem;
      }
    }

    .poster-emoji {
      font-size: 14vw;
      line-height: 1;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: none !important;
    }

    @media (min-width: 500px) {
      .poster-emoji {
        font-size: 4.0rem;
      }

    input[type=range] {
      -webkit-appearance: none;
      background: #EBEBEF;
      height: 3px;
      border-radius: 2px;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 13px;
      width: 13px;
      border-radius: 50%;
      background: #111111;
      cursor: pointer;
    }

    /* 本格リアル火炎 Canvas オーバーレイ */
    #real-fire-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 99999;
      pointer-events: none;
      display: none;
    }

    #real-fire-canvas.active {
      display: block;
      animation: fireCanvasFade 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fireCanvasFade {
      0% { opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { opacity: 0; }
    }

    /* カード枠内専用：底辺から上へゆらゆらメラメラ立ち上るたくさんの炎アニメーション */
    .card-rising-flames {
      position: absolute;
      bottom: -10px;
      left: 0;
      right: 0;
      height: 100%;
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      pointer-events: none;
      z-index: 20;
    }

    .rising-flame-icon {
      font-size: 24px;
      animation: flameRise 1.2s infinite ease-out;
      opacity: 0;
    }

    .rising-flame-icon:nth-child(1) { animation-delay: 0s; }
    .rising-flame-icon:nth-child(2) { animation-delay: 0.15s; }
    .rising-flame-icon:nth-child(3) { animation-delay: 0.3s; }
    .rising-flame-icon:nth-child(4) { animation-delay: 0.1s; }
    .rising-flame-icon:nth-child(5) { animation-delay: 0.25s; }
    .rising-flame-icon:nth-child(6) { animation-delay: 0.4s; }

    @keyframes flameRise {
      0% {
        transform: translateY(20px);
        opacity: 0;
      }
      30% {
        opacity: 0.95;
      }
      80% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(-90px);
        opacity: 0;
      }
    }

    .x-post-card {

      background: #FFFFFF;
      border-bottom: 1px solid #EFF3F4;

      cursor: pointer;

      left: 0;
      right: 0;

    /* 2/3ボトムシートモーダル出現・閉じるアニメーション */

      animation: bottomSheetUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes bottomSheetUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .bottom-sheet-slide-down {
      animation: bottomSheetDown 0.25s cubic-bezier(0.4, 0, 1, 1) forwards;
    }
    @keyframes bottomSheetDown {
      from { transform: translateY(0); }
      to { transform: translateY(100%); }
    }

    .fade-in {
      animation: fadeIn 0.3s ease forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

  <script>
    // --- Web Audio API 低遅延即時サウンドエンジン ---
    const soundEngine = {
      audioCtx: null,
      getAudioContext() {
        if (!this.audioCtx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.audioCtx = new AudioCtx();
        }
        if (this.audioCtx && this.audioCtx.state === 'suspended') {
          this.audioCtx.resume();
        }
        return this.audioCtx;
      },
      playAudio(src) {
        try {
          const audio = new Audio(src);
          audio.currentTime = 0;
          audio.play().catch(e => {});
        } catch (e) {}
      },
      playSoftBurn() {
        this.playAudio('audio/horagai.mp3');
      },
      playGasshoBell() {
        this.playAudio('audio/kanadarai.mp3');
      },
      playSubtleClick() {
        try {
          const ctx = this.getAudioContext();
          if (!ctx) return;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(750, ctx.currentTime);
          gain.gain.setValueAtTime(0.08, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.02);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.02);
        } catch (e) {}
      }
    };

    let capturedPhotoImg = null;

    function createCustomPresetFaceTexture(skinColor, eyeColor, lipColor, hairStyle = 'normal') {
      const canvas = document.createElement('canvas');
      canvas.width = 300;
      canvas.height = 300;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, 300, 300);

      const skinGrad = ctx.createRadialGradient(150, 150, 20, 150, 150, 140);
      skinGrad.addColorStop(0, skinColor[0]);
      skinGrad.addColorStop(0.7, skinColor[1]);
      skinGrad.addColorStop(1, skinColor[2]);
      ctx.fillStyle = skinGrad;
      ctx.beginPath();
      ctx.arc(150, 150, 140, 0, Math.PI * 2);
      ctx.fill();

      // Eyebrows
      ctx.strokeStyle = '#3A2E2B'; ctx.lineWidth = 5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(85, 105); ctx.quadraticCurveTo(115, hairStyle === 'angry' ? 115 : 95, 140, 108); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(160, 108); ctx.quadraticCurveTo(185, hairStyle === 'angry' ? 115 : 95, 215, 105); ctx.stroke();

      // Eyes
      ctx.fillStyle = eyeColor;
      ctx.beginPath(); ctx.ellipse(110, 135, 18, 11, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(190, 135, 18, 11, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath(); ctx.arc(114, 132, 5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(194, 132, 5, 0, Math.PI * 2); ctx.fill();

      // Nose
      ctx.strokeStyle = '#D49E85'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(150, 135); ctx.lineTo(145, 175); ctx.lineTo(155, 178); ctx.stroke();

      // Lips
      ctx.strokeStyle = lipColor; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(150, 205, 22, 0.1, Math.PI - 0.1); ctx.stroke();

      const img = new Image();
      img.src = canvas.toDataURL('image/png');
      return img;
    }

    function initCameraCapture(onSuccess) {
      const video = document.getElementById('webcam-video');
      if (!video) {
        onSuccess(false);
        return;
      }

      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
          .then(stream => {
            video.srcObject = stream;
            video.onloadedmetadata = () => {
              video.play();
              setTimeout(() => {
                captureProcessFacePhoto(video);
                stream.getTracks().forEach(t => t.stop());
                onSuccess(true);
              }, 300);
            };
          })
          .catch(err => {
            console.log('Webcam not accessible:', err);
            onSuccess(false);
          });
      } else {
        onSuccess(false);
      }
    }

    function captureProcessFacePhoto(video) {
      const canvas = document.getElementById('captured-photo-canvas');
      if (!canvas || !video) return;
      const rawW = video.videoWidth || 300;
      const rawH = video.videoHeight || 300;

      const cropW = rawW * 0.5;
      const cropH = rawH * 0.5;
      const cropX = (rawW - cropW) / 2;
      const cropY = (rawH - cropH) / 2;

      canvas.width = 300;
      canvas.height = 300;
      const ctx = canvas.getContext('2d');

      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = 300;
      tempCanvas.height = 300;
      const tempCtx = tempCanvas.getContext('2d');

      tempCtx.translate(300, 0);
      tempCtx.scale(-1, 1);
      tempCtx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, 300, 300);

      ctx.save();
      ctx.beginPath();
      const angles = [
        -Math.PI / 2,
        -Math.PI / 2 + (Math.PI * 2 / 5),
        -Math.PI / 2 + (Math.PI * 4 / 5),
        -Math.PI / 2 + (Math.PI * 6 / 5),
        -Math.PI / 2 + (Math.PI * 8 / 5)
      ];
      const r = 140;
      angles.forEach((a, idx) => {
        const x = 150 + Math.cos(a) * r;
        const y = 150 + Math.sin(a) * r;
        if (idx === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.clip();

      const mosaicSize = 36;
      const mosaicCanvas = document.createElement('canvas');
      mosaicCanvas.width = mosaicSize;
      mosaicCanvas.height = mosaicSize;
      const mosaicCtx = mosaicCanvas.getContext('2d');
      mosaicCtx.drawImage(tempCanvas, 0, 0, mosaicSize, mosaicSize);

      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(mosaicCanvas, 0, 0, 300, 300);
      ctx.restore();

      const img = new Image();
      img.src = canvas.toDataURL('image/png');
      img.onload = () => {
        capturedPhotoImg = img;
      };
    }

    function drawPolaApexMeshDistortedFace(canvas, vibesData, showMetrics = true, customPhotoImg = null) {
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const width = canvas.width;
      const height = canvas.height;
      const cx = width / 2;
      const cy = height / 2 - (showMetrics ? 10 : 0);

      ctx.clearRect(0, 0, width, height);

      const radiusMax = width * (showMetrics ? 0.32 : 0.44);

      // 本物の 3D WebGL 球体のみを綺麗にレンダリング
      const activePhoto = customPhotoImg || capturedPhotoImg || fallbackUserFaceImg;

      if (window.THREE && activePhoto && activePhoto.complete && activePhoto.width > 0) {
        if (!canvas._threeRenderer) {
          const threeCanvas = document.createElement('canvas');
          threeCanvas.width = 512;
          threeCanvas.height = 512;

          const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, alpha: true, antialias: true });
          renderer.setSize(512, 512);
          renderer.setPixelRatio(2);

          const scene = new THREE.Scene();
          const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
          camera.position.z = 3.6;

          const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
          scene.add(ambientLight);

          const dirLight = new THREE.DirectionalLight(0xffffff, 0.65);
          dirLight.position.set(2, 3, 4);
          scene.add(dirLight);

          // 高解像度 3D 球体（SphereGeometry: 96x96 分割でスムーズな変形を実現）
          const geometry = new THREE.SphereGeometry(1.2, 96, 96);

          const texture = new THREE.CanvasTexture(activePhoto);
          texture.wrapS = THREE.ClampToEdgeWrapping;
          texture.wrapT = THREE.ClampToEdgeWrapping;

          const material = new THREE.MeshPhongMaterial({
            map: texture,
            shininess: 30,
            specular: 0x333333,
            side: THREE.FrontSide
          });

          const sphereMesh = new THREE.Mesh(geometry, material);
          sphereMesh.rotation.y = -Math.PI / 2;
          scene.add(sphereMesh);

          const initialPositions = geometry.attributes.position.array.slice();

          canvas._threeRenderer = renderer;
          canvas._threeScene = scene;
          canvas._threeCamera = camera;
          canvas._threeMesh = sphereMesh;
          canvas._threeTexture = texture;
          canvas._threeGeo = geometry;
          canvas._threeInitialPos = initialPositions;
        }

        // テクスチャの更新
        if (canvas._threeTexture.image !== activePhoto) {
          canvas._threeTexture.image = activePhoto;
          canvas._threeTexture.needsUpdate = true;
        }

        // --- 直接タッチドラッグによる頂点変形（トゲトゲしく劇的な変形） ---
        const geo = canvas._threeGeo;
        const posAttr = geo.attributes.position;
        const posArray = posAttr.array;
        const initPos = canvas._threeInitialPos;
        const deformPoints = canvas._deformPoints || [];

        for (let i = 0; i < posArray.length; i += 3) {
          let x = initPos[i];
          let y = initPos[i + 1];
          let z = initPos[i + 2];

          // 各変形ポイントからの影響を累積
          for (const dp of deformPoints) {
            const vdx = x - dp.x3d;
            const vdy = y - dp.y3d;
            const vdz = z - dp.z3d;
            const distSq = vdx * vdx + vdy * vdy + vdz * vdz;

            // シャープなガウス分布（sigma小さめ → トゲトゲしい局所変形）
            const sigma = dp.sigma || 0.22;
            const sigmaSq = sigma * sigma;
            const weight = Math.exp(-distSq / (2 * sigmaSq));

            if (weight > 0.001) {
              // 法線方向にも引っ張ることで立体的なトゲ感を出す
              const nx = initPos[i];
              const ny = initPos[i + 1];
              const nz = initPos[i + 2];
              const nLen = Math.sqrt(nx*nx + ny*ny + nz*nz) || 1;
              const normalScale = dp.normalPull || 0;

              x += dp.dx * weight + (nx / nLen) * normalScale * weight;
              y += dp.dy * weight + (ny / nLen) * normalScale * weight;
              z += dp.dz * weight + (nz / nLen) * normalScale * weight;
            }
          }

          posArray[i] = x;
          posArray[i + 1] = y;
          posArray[i + 2] = z;
        }

        posAttr.needsUpdate = true;
        geo.computeVertexNormals();

        // 3D レンダリング実行
        canvas._threeRenderer.render(canvas._threeScene, canvas._threeCamera);

        // Rendered WebGL Offscreen Canvas をメイン 2D Canvas の中央にプロジェクション描画
        const rSize = radiusMax * 2.3;
        ctx.drawImage(
          canvas._threeRenderer.domElement,
          cx - rSize / 2, cy - rSize / 2, rSize, rSize
        );
      }

      // 3D球体のみをスッキリ表示（5項目テキストラベル非表示）
    }

    function drawTexturedTriangle(ctx, img, s, d) {
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(d[0].x, d[0].y);
      ctx.lineTo(d[1].x, d[1].y);
      ctx.lineTo(d[2].x, d[2].y);
      ctx.closePath();
      ctx.clip();

      const x0 = s[0].x, y0 = s[0].y;
      const x1 = s[1].x, y1 = s[1].y;
      const x2 = s[2].x, y2 = s[2].y;

      const u0 = d[0].x, v0 = d[0].y;
      const u1 = d[1].x, v1 = d[1].y;
      const u2 = d[2].x, v2 = d[2].y;

      const delta = (x1 - x0) * (y2 - y0) - (x2 - x0) * (y1 - y0);
      if (Math.abs(delta) < 0.0001) {
        ctx.restore();
        return;
      }

      const deltaU1 = u1 - u0, deltaU2 = u2 - u0;
      const deltaV1 = v1 - v0, deltaV2 = v2 - v0;

      const a = (deltaU1 * (y2 - y0) - deltaU2 * (y1 - y0)) / delta;
      const b = (deltaV1 * (y2 - y0) - deltaV2 * (y1 - y0)) / delta;
      const c = (deltaU2 * (x1 - x0) - deltaU1 * (x2 - x0)) / delta;
      const dVal = (deltaV2 * (x1 - x0) - deltaV1 * (x2 - x0)) / delta;
      const e = u0 - a * x0 - c * y0;
      const f = v0 - b * x0 - dVal * y0;

      ctx.transform(a, b, c, dVal, e, f);
      ctx.drawImage(img, 0, 0);
      ctx.restore();
    }

          const ry1 = svgH * 0.47;
          const outerPath = document.getElementById('orbit-outer');
          if (outerPath) {
            outerPath.setAttribute('d',
              `M ${cx - rx1},${cy} a ${rx1},${ry1} 0 1,1 ${rx1*2},0 a ${rx1},${ry1} 0 1,1 -${rx1*2},0`
            );
          }

          // 内側の楕円パス（orbit-inner）
          const rx2 = svgW * 0.35;
          const ry2 = svgH * 0.36;
          const innerPath = document.getElementById('orbit-inner');
          if (innerPath) {
            innerPath.setAttribute('d',
              `M ${cx - rx2},${cy} a ${rx2},${ry2} 0 1,0 ${rx2*2},0 a ${rx2},${ry2} 0 1,0 -${rx2*2},0`
            );
          }

          // SVG全体を時計回りに回転させるアニメーション
          let outerAngle = 0;
          let innerAngle = 0;
          const outerTextEl = svg.querySelector('text:first-of-type');
          const innerTextEl = svg.querySelector('text:last-of-type');

          // SVG全体を包む2つのグループを動的に作成して個別に回転
          const animateOrbits = () => {
            if (!document.getElementById('profile-orbit-svg')) return; // ページ遷移で停止
            outerAngle = (outerAngle + 0.18) % 360;
            innerAngle = (innerAngle - 0.13 + 360) % 360;
            if (outerPath) outerPath.setAttribute('transform', `rotate(${outerAngle}, ${cx}, ${cy})`);
            if (innerPath) innerPath.setAttribute('transform', `rotate(${innerAngle}, ${cx}, ${cy})`);
            requestAnimationFrame(animateOrbits);
          };
          requestAnimationFrame(animateOrbits);
        }
      }

      if (selectedPostModal) {
        const modalCanvas = document.getElementById(`modal-canvas-${selectedPostModal.id}`);
        if (modalCanvas) {
          modalCanvas.width = 44;
          modalCanvas.height = 44;
          drawPolaApexMeshDistortedFace(modalCanvas, selectedPostModal.authorVibe, false, selectedPostModal.customPhoto);
        }
      }
    }

    // --- 本格🔥絵文字の全画面ダイナミック火炎物理シミュレーション (3秒間持続・ゆらゆら直進上昇) ---
    function triggerRealFireBurnSimulation(onComplete) {
      const canvas = document.getElementById('real-fire-canvas');
      if (!canvas) {
        onComplete();
        return;
      }

      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const ctx = canvas.getContext('2d');

      soundEngine.playSoftBurn();
      canvas.classList.add('active');

      let particles = [];
      const particleCount = 85;

      for (let i = 0; i < particleCount; i++) {
        particles.push({
          startX: Math.random() * canvas.width,
          x: Math.random() * canvas.width,
          y: canvas.height + Math.random() * 200,
          vy: -(Math.random() * 6 + 4),
          size: Math.floor(Math.random() * 45 + 20),
          rotation: (Math.random() - 0.5) * 0.3,
          rotSpeed: (Math.random() - 0.5) * 0.03,
          opacity: Math.random() * 0.5 + 0.5,
          swayFreq: Math.random() * 0.006 + 0.003,
          swayAmp: Math.random() * 18 + 8
        });
      }

      let animId;
      let startTime = performance.now();

      function loop(now) {
        const elapsed = (now - startTime) / 1000;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 背景の半透明暗転
        ctx.fillStyle = 'rgba(0, 0, 0, 0.22)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        particles.forEach(p => {
          // 左右に優しくゆらゆら揺れながら、まっすぐ上空へ立ち上る（斜め傾きなし）
          p.x = p.startX + Math.sin(now * p.swayFreq + p.y * 0.005) * p.swayAmp;
          p.y += p.vy;

          // 画面外に抜けたら下部からループ再生（3秒間途切れず燃え続ける）
          if (p.y < -80 && elapsed < 2.5) {
            p.y = canvas.height + Math.random() * 60;
            p.startX = Math.random() * canvas.width;
          }

          if (p.y > -100) {
            ctx.save();
            ctx.globalAlpha = Math.max(0, Math.min(1, p.opacity));
            ctx.translate(p.x, p.y);
            ctx.font = `${p.size}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🔥', 0, 0);
            ctx.restore();
          }
        });

        if (elapsed < 3.0) {
          animId = requestAnimationFrame(loop);
        }
      }

      animId = requestAnimationFrame(loop);

      setTimeout(() => {
        onComplete();
        setTimeout(() => {
          cancelAnimationFrame(animId);
          canvas.classList.remove('active');
        }, 300);
      }, 2700);
    }

                renderApp();
              }, 750);
            }, 700);
          } else {
            currentStep = 'vibe_check';
            renderApp();
          }
        };
      }

      // 顔バリエーション切り替え処理ヘルパー
      const switchFaceOption = (targetIdx) => {
        soundEngine.playSubtleClick();
        selectedFaceOption = (targetIdx + 5) % 5;

        if (selectedFaceOption === 4) {
          // 5個目（自分の顔）選択時にカメラ許可を請求
          initCameraCapture(() => {
            renderApp();
          });
        } else {
          fallbackUserFaceImg = presetFaceTextures[selectedFaceOption];
          renderApp();
        }
      };

      const prevArrow = document.getElementById('face-prev-arrow');
      if (prevArrow) {
        prevArrow.onclick = () => switchFaceOption(selectedFaceOption - 1);
      }

      const nextArrow = document.getElementById('face-next-arrow');
      if (nextArrow) {
        nextArrow.onclick = () => switchFaceOption(selectedFaceOption + 1);
      }

      const faceCanvas = document.getElementById('vibe-face-canvas');
      if (faceCanvas && currentStep === 'vibe_check') {
        // 現在の顔テクスチャを取得するヘルパー
        const getActiveFace = () => {
          return (selectedFaceOption === 4 && capturedPhotoImg) ? capturedPhotoImg : presetFaceTextures[selectedFaceOption % 4];
        };

        // 初期状態で変形ポイント配列を用意（まんまる球体）
        if (!faceCanvas._deformPoints) {
          faceCanvas._deformPoints = [];
        }

        let isDragging = false;
        let lastPointerX = 0;
        let lastPointerY = 0;

        // 2Dスクリーン座標 → 3D球体表面座標への近似変換
        // ※ Three.js の球体は rotation.y = -PI/2 でテクスチャが -90 度回転している
        // screenTo3D は表示上の x 座標をそのまま使い、右側でも正しく当たり判定するため
        // スクリーン座標系をキャンバス内比率で完全に計算する
        const screenTo3D = (clientX, clientY) => {
          const rect = faceCanvas.getBoundingClientRect();
          // キャンバス中心からの正規化オフセット (-1 ~ +1)
          const nx = ((clientX - rect.left) / rect.width) * 2 - 1;
          const ny = -(((clientY - rect.top) / rect.height) * 2 - 1);

          // 表示されている球体のスクリーン半径比（Three.js FOV 45°, z=3.6, 半径1.2 から計算）
          const sphereScreenRadius = 0.58;
          const sx = nx / sphereScreenRadius;
          const sy = ny / sphereScreenRadius;
          const r2 = sx * sx + sy * sy;

          if (r2 > 1.02) return null; // 球体外（少し余裕を持たせる）
          const rClamped = Math.min(r2, 1.0);
          const sz = Math.sqrt(1.0 - rClamped);
          return {
            x3d: sx * 1.2,
            y3d: sy * 1.2,
            z3d: sz * 1.2
          };
        };

        faceCanvas.onpointerdown = (e) => {
          e.preventDefault();
          isDragging = true;
          lastPointerX = e.clientX;
          lastPointerY = e.clientY;
          faceCanvas.setPointerCapture(e.pointerId);
          // タップ時に球体が消えないよう、即座に再描画
          drawPolaApexMeshDistortedFace(faceCanvas, vibes, true, getActiveFace());
        };

        faceCanvas.onpointermove = (e) => {
          if (!isDragging) return;
          e.preventDefault();

          const hit = screenTo3D(lastPointerX, lastPointerY);
          if (!hit) {
            lastPointerX = e.clientX;
            lastPointerY = e.clientY;
            return;
          }

          // ドラッグ方向の差分を3D空間の変位に変換（劇的・トゲトゲしい変形のため倍率UP）
          const rect = faceCanvas.getBoundingClientRect();
          const ddx = (e.clientX - lastPointerX) / rect.width * 4.0;
          const ddy = -(e.clientY - lastPointerY) / rect.height * 4.0;
          const dragMag = Math.sqrt(ddx * ddx + ddy * ddy);

          if (dragMag > 0.005) {
            // 法線方向の引っ張り量（ドラッグ距離に比例してトゲが伸びる）
            const normalPull = dragMag * 0.8;

            // 近隣の既存変形ポイントがあれば差分蓄積
            let merged = false;
            for (const dp of faceCanvas._deformPoints) {
              const d = Math.sqrt(
                (dp.x3d - hit.x3d) ** 2 + (dp.y3d - hit.y3d) ** 2 + (dp.z3d - hit.z3d) ** 2
              );
              if (d < 0.15) {
                dp.dx += ddx * 0.7;
                dp.dy += ddy * 0.7;
                dp.normalPull = (dp.normalPull || 0) + normalPull * 0.5;
                merged = true;
                break;
              }
            }

            if (!merged) {
              faceCanvas._deformPoints.push({
                x3d: hit.x3d,
                y3d: hit.y3d,
                z3d: hit.z3d,
                dx: ddx * 0.7,
                dy: ddy * 0.7,
                dz: 0,
                normalPull: normalPull,
                sigma: 0.22
              });
            }

            // 変形ポイント数の上限
            if (faceCanvas._deformPoints.length > 60) {
              faceCanvas._deformPoints = faceCanvas._deformPoints.slice(-45);
            }

            drawPolaApexMeshDistortedFace(faceCanvas, vibes, true, getActiveFace());
          }

          lastPointerX = e.clientX;
          lastPointerY = e.clientY;
        };

        faceCanvas.onpointerup = (e) => {
          isDragging = false;
          try { faceCanvas.releasePointerCapture(e.pointerId); } catch(err) {}
        };
      }

      const toBurnBtn = document.getElementById('btn-to-burn-step');
      if (toBurnBtn) {
        toBurnBtn.onclick = () => {
          soundEngine.playSubtleClick();
          // 今どんな気分？→顔登録ページへ
          currentStep = 'profile';
          renderApp();
        };
      }

      const rantArea = document.getElementById('rant-textarea');
      if (rantArea) {
        rantArea.oninput = (e) => {
          rantText = e.target.value;
          const charCountSpan = document.getElementById('char-count');
          if (charCountSpan) {
            charCountSpan.innerText = rantText.length;
          }
        };

        rantArea.onblur = () => {
          window.scrollTo(0, 0);
          document.body.scrollTop = 0;
        };
      }

      document.querySelectorAll('.tag-btn').forEach(btn => {
        btn.onclick = (e) => {
          const tag = e.currentTarget.dataset.tag;
          if (selectedTags.includes(tag)) {
            if (selectedTags.length > 1) {
              selectedTags = selectedTags.filter(t => t !== tag);
            }
          } else {
            selectedTags.push(tag);
          }
          soundEngine.playSubtleClick();
          renderApp();
        };
      });

      const executeBurnBtn = document.getElementById('btn-execute-burn');
      if (executeBurnBtn) {
        executeBurnBtn.onclick = () => {
          const textarea = document.getElementById('rant-textarea');
          const val = textarea ? textarea.value.trim() : rantText.trim();
          if (!val) return;

          triggerRealFireBurnSimulation(() => {
            const instantReplies = generateContextualSympatheticEnjoReplies(val);

            posts.unshift({
              id: `post-${Date.now()}`,
              userName: 'あなたのお焚き上げ',
              userId: '@my_otakiage',
              dateStr: 'たった今',
              text: val,
              authorVibe: { ...vibes },
              customPhoto: capturedPhotoImg || fallbackUserFaceImg,
              gasshoCount: 1,
              tag: selectedTags.join(' '),
              replies: instantReplies
            });

            burnStats.totalBurned += 1;
            rantText = '';

            currentStep = 'chaos_gallery';
            renderApp();
          });
        };
      }

      // X(旧Twitter)風タイムラインカードタップでダイレクトに投稿詳細モーダルをオープン
      document.querySelectorAll('.post-item-card').forEach(card => {
        card.onclick = (e) => {
          if (e.target.closest('.btn-gassho')) return;
          const postId = card.dataset.postid;
          const post = posts.find(p => p.id === postId);
          if (post) {
            selectedPostModal = post;
            soundEngine.playSubtleClick();
            renderApp();
          }
        };
      });

      const modalSheet = document.getElementById('modal-sheet');
      const modalBackdrop = document.getElementById('modal-backdrop');
      const dragHandle = document.getElementById('modal-drag-handle');

      if (modalSheet && dragHandle) {
        let sheetTouchStartY = 0;
        let isDragging = false;

        dragHandle.onclick = () => {
          soundEngine.playSubtleClick();
          closeModalWithAnimation();
        };

        dragHandle.ontouchstart = (e) => {
          sheetTouchStartY = e.touches[0].clientY;
          isDragging = true;
        };

        dragHandle.ontouchmove = (e) => {
          if (!isDragging) return;
          const currentY = e.touches[0].clientY;
          const diffY = currentY - sheetTouchStartY;
          if (diffY > 0) {
            modalSheet.style.transform = `translateY(${diffY}px)`;
          }
        };

        dragHandle.ontouchend = (e) => {
          isDragging = false;
          const currentY = e.changedTouches[0].clientY;
          const diffY = currentY - sheetTouchStartY;
          if (diffY > 40) {
            closeModalWithAnimation();
          } else {
            modalSheet.style.transform = 'translateY(0)';
          }
        };

        modalBackdrop.onclick = (e) => {
          if (e.target === modalBackdrop) {
            closeModalWithAnimation();
          }
        };
      }

      // コメント入力・即時反映
      const submitReplyBtn = document.getElementById('btn-submit-reply');
      if (submitReplyBtn && selectedPostModal) {
        const handleReplySubmit = () => {
          const input = document.getElementById('modal-reply-input');
          if (input && input.value.trim()) {
            const newReplyText = input.value.trim();
            if (!selectedPostModal.replies) selectedPostModal.replies = [];
            
            const newReplyObj = {
              name: 'あなた',
              handle: '@you',
              text: newReplyText
            };

            selectedPostModal.replies.unshift(newReplyObj);
            input.value = '';
            soundEngine.playSubtleClick();

            const listContainer = document.getElementById('modal-replies-list');
            if (listContainer) {
              const replyDiv = document.createElement('div');
              replyDiv.className = 'bg-paper border border-paper-border p-3 rounded-2xl text-xs hover:border-zinc-300 transition-colors fade-in';
              replyDiv.innerHTML = `
                <div class="flex items-center justify-between mb-1">
                  <span class="font-bold text-zinc-900 text-[11px]">あなた</span>
                  <span class="text-[9px] text-zinc-400 font-mono">@you</span>
                </div>
                <p class="text-zinc-800 font-medium text-[11px] leading-relaxed break-words">${newReplyText}</p>
              `;
              listContainer.insertBefore(replyDiv, listContainer.firstChild);
              listContainer.scrollTop = 0;
            } else {
              renderApp();
            }
          }
        };

        submitReplyBtn.onclick = handleReplySubmit;

        const replyInput = document.getElementById('modal-reply-input');
        if (replyInput) {
          replyInput.onkeypress = (e) => {
            if (e.key === 'Enter') handleReplySubmit();
          };
        }
      }

      const navChaos = document.getElementById('nav-chaos');
      if (navChaos) {
        navChaos.onclick = () => { currentStep = 'chaos_gallery'; soundEngine.playSubtleClick(); renderApp(); };
      }

      const navCreateBurn = document.getElementById('nav-create-burn');
      if (navCreateBurn) {
        navCreateBurn.onclick = () => {
          soundEngine.playSubtleClick();
          currentStep = 'solo_burn';
          renderApp();
        };
      }

      const navProfile = document.getElementById('nav-profile');
      if (navProfile) {
        navProfile.onclick = () => {
          soundEngine.playSubtleClick();
          // マイページ → まず今どんな気分？ → 顔を登録
          currentStep = 'vibe_check';
          renderApp();
        };
      }

      document.querySelectorAll('.btn-gassho').forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          const postId = e.currentTarget.dataset.postid;
          soundEngine.playGasshoBell();

          const post = posts.find(p => p.id === postId);
          if (post) {
            post.gasshoCount += 1;
            burnStats.gasshoGiven += 1;

            const countSpan = document.getElementById(`gassho-count-${postId}`);
            if (countSpan) countSpan.innerText = post.gasshoCount;

            // 🙏ボタンが10回押される（または10の倍数に達する）たびに、その投稿欄だけメラメラ炎上
            if (post.gasshoCount % 10 === 0) {
              soundEngine.playSoftBurn();
              const overlay = document.getElementById(`enjo-flame-overlay-${postId}`);
              const cardElem = document.getElementById(`card-item-${postId}`);
              
              if (overlay) {
                overlay.style.opacity = '1';
                if (cardElem) cardElem.classList.add('bg-amber-50');

                // 本格全画面火炎物理シミュレーションも同時発動
                triggerRealFireBurnSimulation(() => {});

                setTimeout(() => {
                  overlay.style.opacity = '0';
                  if (cardElem) cardElem.classList.remove('bg-amber-50');
                }, 2000);
              }
            }
          }
        };
      });

      const recreateBtn = document.getElementById('btn-recreate-vibe');
      if (recreateBtn) {
        recreateBtn.onclick = () => {
          currentStep = 'vibe_check';
          renderApp();
        };
      }
    }

    // モバイルブラウザでのピンチズーム・ダブルタップ拡大防止
    document.addEventListener('gesturestart', function(e) {
      e.preventDefault();
    }, { passive: false });

    let lastTouchEnd = 0;
    document.addEventListener('touchend', function(e) {
      const now = (new Date()).getTime();
      if (now - lastTouchEnd <= 300) {
        e.preventDefault();
      }
      lastTouchEnd = now;
    }, { passive: false });

    window.onload = function() {
      renderApp();
    };
  </script>
</body>
</html>
