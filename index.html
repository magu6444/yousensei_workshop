      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    body.no-scroll {
      overflow-y: hidden;
      touch-action: none;
    }

    /* 全画面ジャストフィット用コンテナ */
    .screen-container {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100dvh;
      padding-top: max(3.8rem, calc(env(safe-area-inset-top) + 2.8rem));
      padding-bottom: max(3rem, calc(env(safe-area-inset-bottom) + 2rem));
      padding-left: 1.25rem;
      padding-right: 1.25rem;
      overflow: hidden;
    }

    /* ポスタータイトルの縦列ピタリ整列 ＆ ゆったり行間スペース */
    .poster-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      row-gap: 1.2rem;
      column-gap: 0.5rem;
      width: 100%;
      max-width: 340px;
      margin: 0 auto;
    }

    .poster-cell {
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 1;
    }

    .poster-char {
      font-weight: 900 !important;
      font-size: 11vw;
      color: #111111;
      font-family: 'LINE Seed Sans', 'LINE Seed JP', sans-serif !important;
      line-height: 1;
      text-align: center;
    }

    @media (min-width: 500px) {
      .poster-char {
        font-size: 3.4rem;
      }
    }

    .poster-emoji {
      font-size: 9vw;
      line-height: 1;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @media (min-width: 500px) {
      .poster-emoji {
        font-size: 2.8rem;
      }
    }

    /* カスタムスライダー */
    input[type=range] {
      -webkit-appearance: none;
      background: #EBEBEF;
      height: 3px;
      border-radius: 2px;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 13px;
      width: 13px;
      border-radius: 50%;
      background: #111111;
      cursor: pointer;
    }

    /* 本格リアル火炎 Canvas オーバーレイ */
    #real-fire-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 99999;
      pointer-events: none;
      display: none;
    }

    #real-fire-canvas.active {
      display: block;
      animation: fireCanvasFade 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fireCanvasFade {
      0% { opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { opacity: 0; }
    }

    /* カード枠内専用：底辺から上へゆらゆらメラメラ立ち上るたくさんの炎アニメーション */
    .card-rising-flames {
      position: absolute;
      bottom: -10px;
      left: 0;
      right: 0;
      height: 100%;
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      pointer-events: none;
      z-index: 20;
    }

    .rising-flame-icon {
      font-size: 24px;
      animation: flameRise 1.2s infinite ease-out;
      opacity: 0;
    }

    .rising-flame-icon:nth-child(1) { animation-delay: 0s; }
    .rising-flame-icon:nth-child(2) { animation-delay: 0.15s; }
    .rising-flame-icon:nth-child(3) { animation-delay: 0.3s; }
    .rising-flame-icon:nth-child(4) { animation-delay: 0.1s; }
    .rising-flame-icon:nth-child(5) { animation-delay: 0.25s; }
    .rising-flame-icon:nth-child(6) { animation-delay: 0.4s; }

    @keyframes flameRise {
      0% {
        transform: translateY(20px) rotate(-5deg);
        opacity: 0;
      }
      30% {
        opacity: 0.95;
      }
      80% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(-90px) rotate(5deg);
        opacity: 0;
      }
    }

    /* 現X (旧Twitter) 風タイムラインUI */
    .x-post-card {
      width: 100%;
      background: #FFFFFF;
      border-bottom: 1px solid #EFF3F4;
      padding: 14px 16px;
      transition: background-color 0.2s ease;
      cursor: pointer;
    }
    .x-post-card:active {
      background-color: #F7F9F9;
    }

    /* クリーン平面ボトムバー */
    .flat-bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: 448px;
      margin: 0 auto;
      z-index: 40;
      background-color: rgba(255, 255, 255, 0.95);

      border-top: 1px solid #EFF3F4;
      padding: 8px 24px;
      display: flex;
      justify-content: space-around;
      align-items: center;

    /* 2/3ボトムシートモーダル出現・閉じるアニメーション */
    .bottom-sheet-slide-up {
      animation: bottomSheetUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;

    @keyframes bottomSheetUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .bottom-sheet-slide-down {
      animation: bottomSheetDown 0.25s cubic-bezier(0.4, 0, 1, 1) forwards;

    @keyframes bottomSheetDown {
      from { transform: translateY(0); }
      to { transform: translateY(100%); }

    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }

    const soundEngine = {
      playAudio(src) {
        try {
          const audio = new Audio(src);
          audio.currentTime = 0;
          audio.play().catch(e => console.log('Audio play error:', e));
        } catch (e) {
          console.error(e);
        }

      playSoftBurn() {
        this.playAudio('audio/horagai.mp3');
      },
      playGasshoBell() {
        this.playAudio('audio/kanadarai.mp3');
      },
      playSubtleClick() {
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          const ctx = new AudioCtx();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, ctx.currentTime);
          gain.gain.setValueAtTime(0.04, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.03);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.03);
        } catch (e) {}
      }
    };

    let capturedPhotoImg = null;

    function createDefaultFaceTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 300;
      canvas.height = 300;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, 300, 300);

      const skinGrad = ctx.createRadialGradient(150, 150, 20, 150, 150, 140);
      skinGrad.addColorStop(0, '#FFE4D6');
      skinGrad.addColorStop(0.7, '#F7D0BC');
      skinGrad.addColorStop(1, '#EBB59D');
      ctx.fillStyle = skinGrad;
      ctx.beginPath();
      ctx.arc(150, 150, 140, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#3A2E2B'; ctx.lineWidth = 5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(85, 105); ctx.quadraticCurveTo(115, 95, 140, 108); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(160, 108); ctx.quadraticCurveTo(185, 95, 215, 105); ctx.stroke();

      ctx.fillStyle = '#1F1A17';
      ctx.beginPath(); ctx.ellipse(110, 135, 18, 11, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(190, 135, 18, 11, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath(); ctx.arc(114, 132, 5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(194, 132, 5, 0, Math.PI * 2); ctx.fill();

      ctx.strokeStyle = '#D49E85'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(150, 135); ctx.lineTo(145, 175); ctx.lineTo(155, 178); ctx.stroke();

      ctx.strokeStyle = '#C96F68'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(150, 205, 22, 0.1, Math.PI - 0.1); ctx.stroke();

      const img = new Image();
      img.src = canvas.toDataURL('image/png');
      return img;
    }

    function initCameraCapture(onSuccess) {
      const video = document.getElementById('webcam-video');
      if (!video) {
        onSuccess(false);
        return;
      }

      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
          .then(stream => {
            video.srcObject = stream;
            video.onloadedmetadata = () => {
              video.play();
              setTimeout(() => {
                captureProcessFacePhoto(video);
                stream.getTracks().forEach(t => t.stop());
                onSuccess(true);
              }, 300);
            };
          })
          .catch(err => {
            console.log('Webcam not accessible:', err);
            onSuccess(false);
          });
      } else {
        onSuccess(false);
      }
    }

    function captureProcessFacePhoto(video) {
      const canvas = document.getElementById('captured-photo-canvas');
      if (!canvas || !video) return;
      const rawW = video.videoWidth || 300;
      const rawH = video.videoHeight || 300;

      const cropW = rawW * 0.5;
      const cropH = rawH * 0.5;
      const cropX = (rawW - cropW) / 2;
      const cropY = (rawH - cropH) / 2;

      canvas.width = 300;
      canvas.height = 300;
      const ctx = canvas.getContext('2d');

      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = 300;
      tempCanvas.height = 300;
      const tempCtx = tempCanvas.getContext('2d');

      tempCtx.translate(300, 0);
      tempCtx.scale(-1, 1);
      tempCtx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, 300, 300);

      ctx.save();
      ctx.beginPath();
      const angles = [
        -Math.PI / 2,
        -Math.PI / 2 + (Math.PI * 2 / 5),
        -Math.PI / 2 + (Math.PI * 4 / 5),
        -Math.PI / 2 + (Math.PI * 6 / 5),
        -Math.PI / 2 + (Math.PI * 8 / 5)
      ];
      const r = 140;
      angles.forEach((a, idx) => {
        const x = 150 + Math.cos(a) * r;
        const y = 150 + Math.sin(a) * r;
        if (idx === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.clip();

      const mosaicSize = 36;
      const mosaicCanvas = document.createElement('canvas');
      mosaicCanvas.width = mosaicSize;
      mosaicCanvas.height = mosaicSize;
      const mosaicCtx = mosaicCanvas.getContext('2d');
      mosaicCtx.drawImage(tempCanvas, 0, 0, mosaicSize, mosaicSize);

      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(mosaicCanvas, 0, 0, 300, 300);
      ctx.restore();

      const img = new Image();
      img.src = canvas.toDataURL('image/png');
      img.onload = () => {
        capturedPhotoImg = img;
      };
    }

    function drawPolaApexMeshDistortedFace(canvas, vibesData, showMetrics = true, customPhotoImg = null) {
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const width = canvas.width;
      const height = canvas.height;
      const cx = width / 2;
      const cy = height / 2 - (showMetrics ? 10 : 0);

      ctx.clearRect(0, 0, width, height);

      const radiusMax = width * (showMetrics ? 0.32 : 0.46);
      const angles = [
        -Math.PI / 2,
        -Math.PI / 2 + (Math.PI * 2 / 5),
        -Math.PI / 2 + (Math.PI * 4 / 5),
        -Math.PI / 2 + (Math.PI * 6 / 5),
        -Math.PI / 2 + (Math.PI * 8 / 5)
      ];

      const anger = (vibesData.anger || 0) / 100;
      const sadness = (vibesData.sadness || 0) / 100;
      const unfairness = (vibesData.unfairness || 0) / 100;
      const envy = (vibesData.envy || 0) / 100;
      const voidVal = (vibesData.void || 0) / 100;

      const vibeValues = [anger, unfairness, voidVal, envy, sadness];

      let poly5Points = angles.map((a, i) => {
        const v = vibeValues[i];
        const r = radiusMax * v;
        return { x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r };
      });

      if (showMetrics) {
        ctx.strokeStyle = '#EBEBEF';
        ctx.lineWidth = 1;
        [0.25, 0.5, 0.75, 1.0].forEach(rScale => {
          ctx.beginPath();
          angles.forEach((a, idx) => {
            const px = cx + Math.cos(a) * (radiusMax * rScale);
            const py = cy + Math.sin(a) * (radiusMax * rScale);
            if (idx === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          });
          ctx.closePath();
          ctx.stroke();
        });

        ctx.strokeStyle = '#F0F0F4';
        angles.forEach(a => {
          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.lineTo(cx + Math.cos(a) * radiusMax, cy + Math.sin(a) * radiusMax);
          ctx.stroke();
        });
      }

      const activePhoto = customPhotoImg || capturedPhotoImg || fallbackUserFaceImg;
      if (activePhoto && activePhoto.complete) {
        const srcW = activePhoto.width || 300;
        const srcH = activePhoto.height || 300;

        const srcCenter = { x: srcW / 2, y: srcH / 2 };
        const src5Points = angles.map(a => ({
          x: srcCenter.x + Math.cos(a) * (srcW * 0.46),
          y: srcCenter.y + Math.sin(a) * (srcH * 0.46)
        }));

        for (let i = 0; i < 5; i++) {
          const next = (i + 1) % 5;
          const sTriangle = [srcCenter, src5Points[i], src5Points[next]];
          const dTriangle = [{ x: cx, y: cy }, poly5Points[i], poly5Points[next]];

          drawTexturedTriangle(ctx, activePhoto, sTriangle, dTriangle);
        }
      }

      if (showMetrics) {
        ctx.fillStyle = '#111111';
        ctx.font = '700 24px "LINE Seed Sans", "LINE Seed JP", sans-serif';
        const labelPos = [
          { text: 'いらいら', x: cx, y: cy - radiusMax - 14, align: 'center' },
          { text: '理不尽', x: cx + radiusMax + 12, y: cy + 4, align: 'left' },
          { text: '虚無', x: cx + radiusMax * 0.55, y: cy + radiusMax + 30, align: 'left' },
          { text: '嫉妬', x: cx - radiusMax * 0.55, y: cy + radiusMax + 30, align: 'right' },
          { text: '悲しい', x: cx - radiusMax - 12, y: cy + 4, align: 'right' },
        ];
        labelPos.forEach(l => {
          ctx.textAlign = l.align;
          ctx.fillText(l.text, l.x, l.y);
        });
      }
    }

    function drawTexturedTriangle(ctx, img, s, d) {
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(d[0].x, d[0].y);
      ctx.lineTo(d[1].x, d[1].y);
      ctx.lineTo(d[2].x, d[2].y);
      ctx.closePath();
      ctx.clip();

      const x0 = s[0].x, y0 = s[0].y;
      const x1 = s[1].x, y1 = s[1].y;
      const x2 = s[2].x, y2 = s[2].y;

      const u0 = d[0].x, v0 = d[0].y;
      const u1 = d[1].x, v1 = d[1].y;
      const u2 = d[2].x, v2 = d[2].y;

      const delta = (x1 - x0) * (y2 - y0) - (x2 - x0) * (y1 - y0);
      if (Math.abs(delta) < 0.0001) {
        ctx.restore();
        return;
      }

      const deltaU1 = u1 - u0, deltaU2 = u2 - u0;
      const deltaV1 = v1 - v0, deltaV2 = v2 - v0;

      const a = (deltaU1 * (y2 - y0) - deltaU2 * (y1 - y0)) / delta;
      const b = (deltaV1 * (y2 - y0) - deltaV2 * (y1 - y0)) / delta;
      const c = (deltaU2 * (x1 - x0) - deltaU1 * (x2 - x0)) / delta;
      const dVal = (deltaV2 * (x1 - x0) - deltaV1 * (x2 - x0)) / delta;
      const e = u0 - a * x0 - c * y0;
      const f = v0 - b * x0 - dVal * y0;

      ctx.transform(a, b, c, dVal, e, f);
      ctx.drawImage(img, 0, 0);
      ctx.restore();
    }

    // --- 本格リアル火炎物理シミュレーション ---
    function triggerRealFireBurnSimulation(onComplete) {
      const canvas = document.getElementById('real-fire-canvas');
      if (!canvas) {
        onComplete();
        return;
      }

      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const ctx = canvas.getContext('2d');

      soundEngine.playSoftBurn();
      canvas.classList.add('active');

      let particles = [];
      const particleCount = 180;

      for (let i = 0; i < particleCount; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: canvas.height + Math.random() * 100,
          vx: (Math.random() - 0.5) * 3,
          vy: -(Math.random() * 8 + 6),
          size: Math.random() * 30 + 15,
          life: Math.random() * 0.8 + 0.5,
          maxLife: 1.2,
          hue: Math.random() * 40
        });
      }

      let animId;
      let startTime = performance.now();

      function loop(now) {
        const elapsed = (now - startTime) / 1000;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        particles.forEach(p => {
          p.x += p.vx + Math.sin(now * 0.005 + p.y * 0.01) * 1.5;
          p.y += p.vy;
          p.size *= 0.97;
          p.life -= 0.015;

          if (p.life > 0 && p.size > 1) {
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';

            const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
            grad.addColorStop(0, `hsla(${p.hue}, 100%, 75%, ${p.life})`);
            grad.addColorStop(0.4, `hsla(${p.hue - 15}, 100%, 50%, ${p.life * 0.8})`);
            grad.addColorStop(1, `rgba(255, 0, 0, 0)`);

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
        });

        if (elapsed < 1.3) {
          animId = requestAnimationFrame(loop);
        }
      }

      animId = requestAnimationFrame(loop);

      setTimeout(() => {
        onComplete();
        setTimeout(() => {
          cancelAnimationFrame(animId);
          canvas.classList.remove('active');
        }, 300);
      }, 1000);
    }

    function closeModalWithAnimation() {

    // --- イベントリスナー ---
    function setupEventListeners() {
      const btnJp = document.getElementById('lang-btn-jp');
      if (btnJp) {
        btnJp.onclick = (e) => {
          e.stopPropagation();
          currentLang = 'JP';
          soundEngine.playSubtleClick();
          renderApp();
        };
      }

      const btnEn = document.getElementById('lang-btn-en');
      if (btnEn) {
        btnEn.onclick = (e) => {
          e.stopPropagation();
          currentLang = 'EN';
          soundEngine.playSubtleClick();
          renderApp();
        };
      }

      const startBtn = document.getElementById('btn-start-app');
      if (startBtn) {
        startBtn.onclick = () => {
          soundEngine.playSubtleClick();
          initCameraCapture(() => {
            currentStep = 'vibe_check';
            renderApp();
          });
        };
      }

      const faceCanvas = document.getElementById('vibe-face-canvas');
      if (faceCanvas && currentStep === 'vibe_check') {
        let isDraggingVertex = false;
        let activeKey = null;

        const keys = ['anger', 'unfairness', 'void', 'envy', 'sadness'];
        const angles = [
          -Math.PI / 2,
          -Math.PI / 2 + (Math.PI * 2 / 5),
          -Math.PI / 2 + (Math.PI * 4 / 5),
          -Math.PI / 2 + (Math.PI * 6 / 5),
          -Math.PI / 2 + (Math.PI * 8 / 5)
        ];

        const updateVibeFromPointer = (clientX, clientY) => {
          const rect = faceCanvas.getBoundingClientRect();
          const x = (clientX - rect.left) * (faceCanvas.width / rect.width);
          const y = (clientY - rect.top) * (faceCanvas.height / rect.height);
          const cx = faceCanvas.width / 2;
          const cy = faceCanvas.height / 2 - 10;

          const dx = x - cx;
          const dy = y - cy;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const radiusMax = faceCanvas.width * 0.38;

          let val = Math.round(Math.min(100, Math.max(10, (dist / radiusMax) * 100)));

          if (!activeKey) {
            let angle = Math.atan2(dy, dx);
            let minDiff = Infinity;
            let closestIdx = 0;
            angles.forEach((a, i) => {
              let diff = Math.abs(angle - a);
              if (diff > Math.PI) diff = Math.PI * 2 - diff;
              if (diff < minDiff) {
                minDiff = diff;
                closestIdx = i;
              }
            });
            activeKey = keys[closestIdx];
          }

          if (activeKey) {
            vibes[activeKey] = val;
            soundEngine.playSubtleClick();
            drawPolaApexMeshDistortedFace(faceCanvas, vibes, true, capturedPhotoImg || fallbackUserFaceImg);
          }
        };

        faceCanvas.onpointerdown = (e) => {
          isDraggingVertex = true;
          activeKey = null;
          faceCanvas.setPointerCapture(e.pointerId);
          updateVibeFromPointer(e.clientX, e.clientY);
        };

        faceCanvas.onpointermove = (e) => {
          if (isDraggingVertex) {
            updateVibeFromPointer(e.clientX, e.clientY);
          }
        };

        faceCanvas.onpointerup = (e) => {
          isDraggingVertex = false;
          activeKey = null;
          try { faceCanvas.releasePointerCapture(e.pointerId); } catch(err) {}
        };
      }

      const toBurnBtn = document.getElementById('btn-to-burn-step');
      if (toBurnBtn) {
        toBurnBtn.onclick = () => {
          soundEngine.playSubtleClick();
          currentStep = 'solo_burn';
          renderApp();
        };
      }

      const rantArea = document.getElementById('rant-textarea');
      if (rantArea) {
        rantArea.oninput = (e) => {
          rantText = e.target.value;
          const charCountSpan = document.getElementById('char-count');
          if (charCountSpan) {
            charCountSpan.innerText = rantText.length;
          }
        };

        rantArea.onblur = () => {
          window.scrollTo(0, 0);
          document.body.scrollTop = 0;
        };
      }

      document.querySelectorAll('.tag-btn').forEach(btn => {
        btn.onclick = (e) => {
          const tag = e.currentTarget.dataset.tag;
          if (selectedTags.includes(tag)) {
            if (selectedTags.length > 1) {
              selectedTags = selectedTags.filter(t => t !== tag);
            }
          } else {
            selectedTags.push(tag);
          }
          soundEngine.playSubtleClick();
          renderApp();
        };
      });

      const executeBurnBtn = document.getElementById('btn-execute-burn');
      if (executeBurnBtn) {
        executeBurnBtn.onclick = () => {
          const textarea = document.getElementById('rant-textarea');
          const val = textarea ? textarea.value.trim() : rantText.trim();
          if (!val) return;

          triggerRealFireBurnSimulation(() => {
            const instantReplies = generateContextualSympatheticEnjoReplies(val);

            posts.unshift({
              id: `post-${Date.now()}`,
              userName: 'あなたのお焚き上げ',
              userId: '@my_otakiage',
              dateStr: 'たった今',
              text: val,
              authorVibe: { ...vibes },
              customPhoto: capturedPhotoImg || fallbackUserFaceImg,
              gasshoCount: 1,
              tag: selectedTags.join(' '),
              replies: instantReplies
            });

            burnStats.totalBurned += 1;
            rantText = '';

            currentStep = 'chaos_gallery';
            renderApp();
          });
        };
      }

      // X(旧Twitter)風タイムラインカードタップでダイレクトに投稿詳細モーダルをオープン
      document.querySelectorAll('.post-item-card').forEach(card => {
        card.onclick = (e) => {
          if (e.target.closest('.btn-gassho')) return;
          const postId = card.dataset.postid;
          const post = posts.find(p => p.id === postId);
          if (post) {
            selectedPostModal = post;
            soundEngine.playSubtleClick();
            renderApp();
          }
        };
      });

      const modalSheet = document.getElementById('modal-sheet');
      const modalBackdrop = document.getElementById('modal-backdrop');
      const dragHandle = document.getElementById('modal-drag-handle');

      if (modalSheet && dragHandle) {
        let sheetTouchStartY = 0;
        let isDragging = false;

        dragHandle.onclick = () => {
          soundEngine.playSubtleClick();
          closeModalWithAnimation();
        };

        dragHandle.ontouchstart = (e) => {
          sheetTouchStartY = e.touches[0].clientY;
          isDragging = true;
        };

        dragHandle.ontouchmove = (e) => {
          if (!isDragging) return;
          const currentY = e.touches[0].clientY;
          const diffY = currentY - sheetTouchStartY;
          if (diffY > 0) {
            modalSheet.style.transform = `translateY(${diffY}px)`;
          }
        };

        dragHandle.ontouchend = (e) => {
          isDragging = false;
          const currentY = e.changedTouches[0].clientY;
          const diffY = currentY - sheetTouchStartY;
          if (diffY > 40) {
            closeModalWithAnimation();
          } else {
            modalSheet.style.transform = 'translateY(0)';
          }
        };

        modalBackdrop.onclick = (e) => {
          if (e.target === modalBackdrop) {
            closeModalWithAnimation();
          }
        };
      }

      // コメント入力・即時反映
      const submitReplyBtn = document.getElementById('btn-submit-reply');
      if (submitReplyBtn && selectedPostModal) {
        const handleReplySubmit = () => {
          const input = document.getElementById('modal-reply-input');

            const newReplyText = input.value.trim();
            if (!selectedPostModal.replies) selectedPostModal.replies = [];

              name: 'あなた',
              handle: '@you',
              text: newReplyText

            selectedPostModal.replies.unshift(newReplyObj);
            input.value = '';
            soundEngine.playSubtleClick();

            const listContainer = document.getElementById('modal-replies-list');
            if (listContainer) {
              const replyDiv = document.createElement('div');
              replyDiv.className = 'bg-paper border border-paper-border p-3 rounded-2xl text-xs hover:border-zinc-300 transition-colors fade-in';
              replyDiv.innerHTML = `
                <div class="flex items-center justify-between mb-1">
                  <span class="font-bold text-zinc-900 text-[11px]">あなた</span>
                  <span class="text-[9px] text-zinc-400 font-mono">@you</span>
                </div>
                <p class="text-zinc-800 font-medium text-[11px] leading-relaxed break-words">${newReplyText}</p>
              `;
              listContainer.insertBefore(replyDiv, listContainer.firstChild);
              listContainer.scrollTop = 0;
            } else {
              renderApp();
            }
          }
        };

        submitReplyBtn.onclick = handleReplySubmit;

        const replyInput = document.getElementById('modal-reply-input');
        if (replyInput) {
          replyInput.onkeypress = (e) => {
            if (e.key === 'Enter') handleReplySubmit();
          };
        }
      }

      const navChaos = document.getElementById('nav-chaos');
      if (navChaos) {
        navChaos.onclick = () => { currentStep = 'chaos_gallery'; soundEngine.playSubtleClick(); renderApp(); };
      }

      const navCreateBurn = document.getElementById('nav-create-burn');
      if (navCreateBurn) {
        navCreateBurn.onclick = () => {
          soundEngine.playSubtleClick();
          currentStep = 'solo_burn';
          renderApp();
        };
      }

      const navProfile = document.getElementById('nav-profile');
      if (navProfile) {
        navProfile.onclick = () => { currentStep = 'profile'; soundEngine.playSubtleClick(); renderApp(); };
      }

      document.querySelectorAll('.btn-gassho').forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          const postId = e.currentTarget.dataset.postid;
          soundEngine.playGasshoBell();

          const post = posts.find(p => p.id === postId);
          if (post) {
            post.gasshoCount += 1;
            burnStats.gasshoGiven += 1;

            const countSpan = document.getElementById(`gassho-count-${postId}`);
            if (countSpan) countSpan.innerText = post.gasshoCount;

            // 🙏ボタンが10回押される（または10の倍数に達する）たびに、その投稿欄だけメラメラ炎上
            if (post.gasshoCount % 10 === 0) {
              soundEngine.playSoftBurn();
              const overlay = document.getElementById(`enjo-flame-overlay-${postId}`);
              const cardElem = document.getElementById(`card-item-${postId}`);
              
              if (overlay) {
                overlay.style.opacity = '1';
                if (cardElem) cardElem.classList.add('bg-amber-50');

                // 本格全画面火炎物理シミュレーションも同時発動
                triggerRealFireBurnSimulation(() => {});

                setTimeout(() => {
                  overlay.style.opacity = '0';
                  if (cardElem) cardElem.classList.remove('bg-amber-50');
                }, 2000);
              }
            }
          }
        };
      });

      const recreateBtn = document.getElementById('btn-recreate-vibe');
      if (recreateBtn) {
        recreateBtn.onclick = () => {
          currentStep = 'vibe_check';
          renderApp();
        };
      }
    }
