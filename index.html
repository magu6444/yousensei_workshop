  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            paper: {
              DEFAULT: '#FAFAFC',
              card: '#FFFFFF',

              accent: '#1D9BF0',
            }
          },
          fontFamily: {
            sans: ['"LINE Seed Sans"', '"LINE Seed JP"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    @font-face {
      font-family: 'LINE Seed Sans';
      src: url('fonts/LINESeedSans_W_Rg.woff2') format('woff2'),
           url('fonts/LINESeedSans_W_Rg.woff') format('woff');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'LINE Seed Sans';
      src: url('fonts/LINESeedSans_W_Bd.woff2') format('woff2'),
           url('fonts/LINESeedSans_W_Bd.woff') format('woff');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'LINE Seed JP';
      src: url('fonts/LINESeedJP_OTF_Rg.woff2') format('woff2'),
           url('fonts/LINESeedJP_OTF_Rg.woff') format('woff'),
           url('fonts/LINESeedJP_TTF_Rg.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'LINE Seed JP';
      src: url('fonts/LINESeedJP_OTF_Bd.woff2') format('woff2'),
           url('fonts/LINESeedJP_OTF_Bd.woff') format('woff'),
           url('fonts/LINESeedJP_TTF_Bd.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'LINE Seed JP';
      src: url('fonts/LINESeedJP_OTF_Eb.woff2') format('woff2'),
           url('fonts/LINESeedJP_OTF_Eb.woff') format('woff');
      font-weight: 900;
      font-style: normal;
      font-display: swap;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      box-shadow: none !important;
      font-family: 'LINE Seed Sans', 'LINE Seed JP', sans-serif !important;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      background-color: #FFFFFF;
      color: #0F1419;
      font-family: 'LINE Seed Sans', 'LINE Seed JP', sans-serif !important;
      overflow-x: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      touch-action: pan-x pan-y;
      -webkit-text-size-adjust: 100%;
    }

    body.no-scroll {
      overflow-y: hidden;
      touch-action: none;
    }

    /* 全画面最前面レイヤー：上部（アセット 3）＆ 下部（アセット 4）牙フレーム */
    .app-top-teeth-frame {
      position: fixed;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      width: 100vw;
      max-width: 448px;
      height: auto;
      z-index: 9999;
      pointer-events: none;
      display: none;
      transition: transform 0.75s cubic-bezier(0.77, 0, 0.175, 1);
    }

    .app-bottom-teeth-frame {
      position: fixed;
      bottom: -14px;
      left: 50%;
      transform: translateX(-50%);
      width: 100vw;
      max-width: 448px;
      height: auto;
      z-index: 9999;
      pointer-events: none;
      display: none;
      transition: transform 0.75s cubic-bezier(0.77, 0, 0.175, 1);
    }

    /* タイトル画面のみ牙フレームを表示 */
    body.is-intro .app-top-teeth-frame,
    body.is-intro .app-bottom-teeth-frame {
      display: block;
    }

    /* 牙がガツンと噛み合うアグレッシブなアニメーション */
    .app-top-teeth-frame.bite-snap {
      transform: translateX(-50%) translateY(45%);
    }

    .app-bottom-teeth-frame.bite-snap {
      transform: translateX(-50%) translateY(-45%);
    }

    /* 噛み合った後にガバッと上下に開いて画面外へ全開逃走 */
    .app-top-teeth-frame.open-wide {
      transform: translateX(-50%) translateY(-120%);
    }

    .app-bottom-teeth-frame.open-wide {
      transform: translateX(-50%) translateY(120%);
    }

    /* 全画面ジャストフィット用コンテナ */
    .screen-container {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100dvh;
      padding-top: max(7.0rem, calc(env(safe-area-inset-top) + 6.0rem));
      padding-bottom: max(4.5rem, calc(env(safe-area-inset-bottom) + 3.5rem));
      padding-left: 1.25rem;
      padding-right: 1.25rem;
      overflow: hidden;
    }

    /* ポスタータイトルの縦列整列 ＆ 行間詰めつつ16vwの最適サイズで画面中央やや下寄りに配置 */
    .poster-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      row-gap: 0.15rem;
      column-gap: -7px;
      width: 100%;
      max-width: 245px;
      margin: 0 auto;
    }

    .poster-cell {
      display: flex;
      align-items: center;
      justify-content: center;
      height: auto;
      aspect-ratio: 1;
    }

    .poster-char {
      font-weight: 400 !important;
      font-size: 16vw;
      color: #111111;
      font-family: 'LINE Seed Sans', 'LINE Seed JP', sans-serif !important;
      line-height: 1;
      text-align: center;
      display: inline-block;
      transform: scaleX(0.65);
      transform-origin: center center;
    }

    @media (min-width: 500px) {
      .poster-char {
        font-size: 4.6rem;
      }
    }

    .poster-emoji {
      font-size: 14vw;
      line-height: 1;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: none !important;
    }

    @media (min-width: 500px) {
      .poster-emoji {
        font-size: 4.0rem;
      }
    }

    /* カスタムスライダー */
    input[type=range] {
      -webkit-appearance: none;
      background: #EBEBEF;
      height: 3px;
      border-radius: 2px;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 13px;
      width: 13px;
      border-radius: 50%;
      background: #111111;
      cursor: pointer;
    }

    /* 本格リアル火炎 Canvas オーバーレイ */
    #real-fire-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 99999;
      pointer-events: none;
      display: none;
    }

    #real-fire-canvas.active {
      display: block;
      animation: fireCanvasFade 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fireCanvasFade {
      0% { opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { opacity: 0; }
    }

    /* カード枠内専用：底辺から上へゆらゆらメラメラ立ち上るたくさんの炎アニメーション */
    .card-rising-flames {
      position: absolute;
      bottom: -10px;
      left: 0;
      right: 0;
      height: 100%;
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      pointer-events: none;
      z-index: 20;
    }

    .rising-flame-icon {
      font-size: 24px;
      animation: flameRise 1.2s infinite ease-out;
      opacity: 0;
    }

    .rising-flame-icon:nth-child(1) { animation-delay: 0s; }
    .rising-flame-icon:nth-child(2) { animation-delay: 0.15s; }
    .rising-flame-icon:nth-child(3) { animation-delay: 0.3s; }
    .rising-flame-icon:nth-child(4) { animation-delay: 0.1s; }
    .rising-flame-icon:nth-child(5) { animation-delay: 0.25s; }
    .rising-flame-icon:nth-child(6) { animation-delay: 0.4s; }

    @keyframes flameRise {
      0% {
        transform: translateY(20px);
        opacity: 0;
      }
      30% {
        opacity: 0.95;
      }
      80% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(-90px);
        opacity: 0;
      }
    }

    /* 現X (旧Twitter) 風タイムラインUI */
    .x-post-card {
      width: 100%;
      background: #FFFFFF;
      border-bottom: 1px solid #EFF3F4;
      padding: 14px 16px;
      transition: background-color 0.2s ease;
      cursor: pointer;
    }
    .x-post-card:active {
      background-color: #F7F9F9;
    }

    /* TAP ENTRY 明滅アニメーション */
    .tap-entry-text {
      animation: tapEntryBlink 1.8s infinite ease-in-out;
    }
    @keyframes tapEntryBlink {
      0%, 100% { opacity: 0.25; transform: scale(0.98); }
      50% { opacity: 0.85; transform: scale(1.02); }
    }

    /* クリーン平面ボトムバー */
    .flat-bottom-nav {
      position: fixed;
      bottom: 16px;
      left: 16px;
      right: 16px;
      max-width: 416px;
      margin: 0 auto;
      z-index: 40;
      background-color: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(239, 243, 244, 0.8);
      border-radius: 24px;
      padding: 6px 16px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
      padding-bottom: calc(6px + env(safe-area-inset-bottom));
    }

    /* 白黒反転スタイル（「いま、どんな気分？」画面用） */
    .flat-bottom-nav.inverted-theme {
      background-color: rgba(15, 20, 25, 0.85) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    /* 2/3ボトムシートモーダル出現・閉じるアニメーション */
    .bottom-sheet-slide-up {
      animation: bottomSheetUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes bottomSheetUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .bottom-sheet-slide-down {
      animation: bottomSheetDown 0.25s cubic-bezier(0.4, 0, 1, 1) forwards;
    }
    @keyframes bottomSheetDown {
      from { transform: translateY(0); }
      to { transform: translateY(100%); }
    }

    .fade-in {
      animation: fadeIn 0.3s ease forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .animate-float-slow {
      animation: floatSlow 5s ease-in-out infinite;
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
  </style>
</head>

  <script>
    // --- Web Audio API 低遅延即時サウンドエンジン ---
    const soundEngine = {
      audioCtx: null,
      getAudioContext() {
        if (!this.audioCtx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.audioCtx = new AudioCtx();
        }
        if (this.audioCtx && this.audioCtx.state === 'suspended') {
          this.audioCtx.resume();
        }
        return this.audioCtx;
      },
      playAudio(src) {
        try {
          const audio = new Audio(src);
          audio.currentTime = 0;
          audio.play().catch(e => {});
        } catch (e) {}
      },
      playSoftBurn() {
        this.playAudio('audio/horagai.mp3');
      },
      playGasshoBell() {
        this.playAudio('audio/kanadarai.mp3');
      },
      playSubtleClick() {
        try {
          const ctx = this.getAudioContext();
          if (!ctx) return;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(750, ctx.currentTime);
          gain.gain.setValueAtTime(0.08, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.02);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.02);
        } catch (e) {}
      }
    };

    let capturedPhotoImg = null;

    function createCustomPresetFaceTexture(skinColor, eyeColor, lipColor, hairStyle = 'normal') {
      const canvas = document.createElement('canvas');
      canvas.width = 300;
      canvas.height = 300;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, 300, 300);

      const skinGrad = ctx.createRadialGradient(150, 150, 20, 150, 150, 140);
      skinGrad.addColorStop(0, skinColor[0]);
      skinGrad.addColorStop(0.7, skinColor[1]);
      skinGrad.addColorStop(1, skinColor[2]);
      ctx.fillStyle = skinGrad;
      ctx.beginPath();
      ctx.arc(150, 150, 140, 0, Math.PI * 2);
      ctx.fill();

      // Eyebrows
      ctx.strokeStyle = '#3A2E2B'; ctx.lineWidth = 5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(85, 105); ctx.quadraticCurveTo(115, hairStyle === 'angry' ? 115 : 95, 140, 108); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(160, 108); ctx.quadraticCurveTo(185, hairStyle === 'angry' ? 115 : 95, 215, 105); ctx.stroke();

      // Eyes
      ctx.fillStyle = eyeColor;
      ctx.beginPath(); ctx.ellipse(110, 135, 18, 11, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(190, 135, 18, 11, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath(); ctx.arc(114, 132, 5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(194, 132, 5, 0, Math.PI * 2); ctx.fill();

      // Nose
      ctx.strokeStyle = '#D49E85'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(150, 135); ctx.lineTo(145, 175); ctx.lineTo(155, 178); ctx.stroke();

      // Lips
      ctx.strokeStyle = lipColor; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(150, 205, 22, 0.1, Math.PI - 0.1); ctx.stroke();

      const img = new Image();
      img.src = canvas.toDataURL('image/png');
      return img;
    }

    let fallbackUserFaceImg = new Image();
    fallbackUserFaceImg.src = 'images/face_preset_0.jpg';

    let localMediaStream = null;
    let isCameraPreviewing = true; // 最初はカメラプレビュー
    let vibesHistory = [];
    let vibesHistoryIndex = -1;

    // CSSだけで顔写真を歪ませるスタイル計算ロジック
    function getDistortionStyle(v) {
      const anger = v.anger || 0;
      const sadness = v.sadness || 0;
      const unfairness = v.unfairness || 0;
      const envy = v.envy || 0;
      const voidVal = v.void || 0;

      // 感情パラメータによる歪み計算
      const skewX = (anger * 0.35) + (unfairness * 0.2); 
      const skewY = (unfairness * 0.35) + (envy * 0.15); 
      const scale = 1.0 - (sadness * 0.002) - (voidVal * 0.001); 
      const rotate = (unfairness * 0.4) - (anger * 0.2); 

      // 色調変化
      let hue = 0;
      let saturate = 1.0;
      let contrast = 1.0;
      let grayscale = 0;
      let opacity = 1.0;

      if (anger > 20) {
        hue = -40 * (anger / 100);
        saturate = 1.0 + (anger / 40);
        contrast = 1.0 + (anger / 100);
      }
      if (sadness > 20) {
        hue = 180 * (sadness / 100);
        saturate = 1.0 + (sadness / 80);
      }
      if (envy > 20) {
        hue = 80 * (envy / 100);
        saturate = 1.0 + (envy / 40);
      }
      if (voidVal > 20) {
        grayscale = voidVal / 100;
        opacity = 1.0 - (voidVal * 0.006);
      }

      return `transform: rotate(${rotate}deg) skew(${skewX}deg, ${skewY}deg) scale(${scale}); filter: hue-rotate(${hue}deg) saturate(${saturate}) contrast(${contrast}) grayscale(${grayscale}) opacity(${opacity}); transition: transform 0.2s ease, filter 0.2s ease;`;
    }

    function startCamera(videoElement, onReady) {
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 480, height: 480 }, audio: false })
          .then(stream => {
            localMediaStream = stream;
            videoElement.srcObject = stream;
            videoElement.onloadedmetadata = () => {
              videoElement.play();
              onReady(true);
            };
          })
          .catch(err => {
            console.warn('Camera access error:', err);
            onReady(false);
          });
      } else {
        onReady(false);
      }
    }

    // カメラの停止
    function stopCamera() {
      if (localMediaStream) {
        localMediaStream.getTracks().forEach(t => t.stop());
        localMediaStream = null;
      }
    }

    function captureFacePhoto(videoElement) {
      const canvas = document.getElementById('captured-photo-canvas');
      if (!canvas || !videoElement) return null;

      const size = 300;
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      const rawW = videoElement.videoWidth || 300;
      const rawH = videoElement.videoHeight || 300;
      const cropSize = Math.min(rawW, rawH);
      const cropX = (rawW - cropSize) / 2;
      const cropY = (rawH - cropSize) / 2;

      ctx.translate(size, 0);
      ctx.scale(-1, 1);
      
      ctx.beginPath();
      ctx.arc(size/2, size/2, size/2, 0, Math.PI * 2);
      ctx.clip();
      
      ctx.drawImage(videoElement, cropX, cropY, cropSize, cropSize, 0, 0, size, size);

      const dataUrl = canvas.toDataURL('image/png');
      const img = new Image();
      img.src = dataUrl;
      img.onload = () => {
        capturedPhotoImg = img;
      };
      return dataUrl;
    }

    function pushVibesHistory() {
      const copy = { ...vibes };
      if (vibesHistoryIndex < vibesHistory.length - 1) {
        vibesHistory = vibesHistory.slice(0, vibesHistoryIndex + 1);
      }
      vibesHistory.push(copy);
      vibesHistoryIndex = vibesHistory.length - 1;
    }

    function undoVibes() {
      if (vibesHistoryIndex > 0) {
        vibesHistoryIndex--;
        vibes = { ...vibesHistory[vibesHistoryIndex] };
        updateSlidersAndFace();
      }
    }

    function redoVibes() {
      if (vibesHistoryIndex < vibesHistory.length - 1) {
        vibesHistoryIndex++;
        vibes = { ...vibesHistory[vibesHistoryIndex] };
        updateSlidersAndFace();
      }
    }

    function updateSlidersAndFace() {
      const keys = ['anger', 'sadness', 'unfairness', 'envy', 'void'];
      keys.forEach(key => {
        const input = document.getElementById(`slider-${key}`);
        if (input) input.value = vibes[key];
        const valSpan = document.getElementById(`val-${key}`);
        if (valSpan) valSpan.innerText = vibes[key];
      });
      const faceImg = document.getElementById('vibe-face-preview-img');
      if (faceImg) {
        faceImg.style.cssText = getDistortionStyle(vibes);
      }
    }

    function drawPolaApexMeshDistortedFace(canvas, vibesData, showMetrics = true, customPhotoImg = null) {
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const width = canvas.width;
      const height = canvas.height;
      const cx = width / 2;
      const cy = height / 2 - (showMetrics ? 10 : 0);

      ctx.clearRect(0, 0, width, height);

      const radiusMax = width * (showMetrics ? 0.32 : 0.44);

      // 本物の 3D WebGL 球体のみを綺麗にレンダリング
      const activePhoto = customPhotoImg || capturedPhotoImg || fallbackUserFaceImg;

      if (window.THREE && activePhoto && activePhoto.complete && activePhoto.width > 0) {
        if (!canvas._threeRenderer) {
          const threeCanvas = document.createElement('canvas');
          threeCanvas.width = 512;
          threeCanvas.height = 512;

          const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, alpha: true, antialias: true });
          renderer.setSize(512, 512);
          renderer.setPixelRatio(2);

          const scene = new THREE.Scene();
          const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
          camera.position.z = 3.6;

          const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
          scene.add(ambientLight);

          const dirLight = new THREE.DirectionalLight(0xffffff, 0.65);
          dirLight.position.set(2, 3, 4);
          scene.add(dirLight);

          // 高解像度 3D 球体（SphereGeometry: 96x96 分割でスムーズな変形を実現）
          const geometry = new THREE.SphereGeometry(1.2, 96, 96);

          const texture = new THREE.CanvasTexture(activePhoto);
          texture.wrapS = THREE.ClampToEdgeWrapping;
          texture.wrapT = THREE.ClampToEdgeWrapping;

          const material = new THREE.MeshPhongMaterial({
            map: texture,
            shininess: 30,
            specular: 0x333333,
            side: THREE.FrontSide
          });

          const sphereMesh = new THREE.Mesh(geometry, material);
          sphereMesh.rotation.y = -Math.PI / 2;
          scene.add(sphereMesh);

          const initialPositions = geometry.attributes.position.array.slice();

          canvas._threeRenderer = renderer;
          canvas._threeScene = scene;
          canvas._threeCamera = camera;
          canvas._threeMesh = sphereMesh;
          canvas._threeTexture = texture;
          canvas._threeGeo = geometry;
          canvas._threeInitialPos = initialPositions;
        }

        // テクスチャの更新
        if (canvas._threeTexture.image !== activePhoto) {
          canvas._threeTexture.image = activePhoto;
          canvas._threeTexture.needsUpdate = true;
        }

        // --- 直接タッチドラッグによる頂点変形（トゲトゲしく劇的な変形） ---
        const geo = canvas._threeGeo;
        const posAttr = geo.attributes.position;
        const posArray = posAttr.array;
        const initPos = canvas._threeInitialPos;
        const deformPoints = canvas._deformPoints || [];

        for (let i = 0; i < posArray.length; i += 3) {
          let x = initPos[i];
          let y = initPos[i + 1];
          let z = initPos[i + 2];

          // 各変形ポイントからの影響を累積
          for (const dp of deformPoints) {
            const vdx = x - dp.x3d;
            const vdy = y - dp.y3d;
            const vdz = z - dp.z3d;
            const distSq = vdx * vdx + vdy * vdy + vdz * vdz;

            // シャープなガウス分布（sigma小さめ → トゲトゲしい局所変形）
            const sigma = dp.sigma || 0.22;
            const sigmaSq = sigma * sigma;
            const weight = Math.exp(-distSq / (2 * sigmaSq));

            if (weight > 0.001) {
              // 法線方向にも引っ張ることで立体的なトゲ感を出す
              const nx = initPos[i];
              const ny = initPos[i + 1];
              const nz = initPos[i + 2];
              const nLen = Math.sqrt(nx*nx + ny*ny + nz*nz) || 1;
              const normalScale = dp.normalPull || 0;

              x += dp.dx * weight + (nx / nLen) * normalScale * weight;
              y += dp.dy * weight + (ny / nLen) * normalScale * weight;
              z += dp.dz * weight + (nz / nLen) * normalScale * weight;
            }
          }

          posArray[i] = x;
          posArray[i + 1] = y;
          posArray[i + 2] = z;
        }

        posAttr.needsUpdate = true;
        geo.computeVertexNormals();

        // 3D レンダリング実行
        canvas._threeRenderer.render(canvas._threeScene, canvas._threeCamera);

        // Rendered WebGL Offscreen Canvas をメイン 2D Canvas の中央にプロジェクション描画
        const rSize = radiusMax * 2.3;
        ctx.drawImage(
          canvas._threeRenderer.domElement,
          cx - rSize / 2, cy - rSize / 2, rSize, rSize
        );
      }

      // 3D球体のみをスッキリ表示（5項目テキストラベル非表示）
    }

    function drawTexturedTriangle(ctx, img, s, d) {
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(d[0].x, d[0].y);
      ctx.lineTo(d[1].x, d[1].y);
      ctx.lineTo(d[2].x, d[2].y);
      ctx.closePath();
      ctx.clip();

      const x0 = s[0].x, y0 = s[0].y;
      const x1 = s[1].x, y1 = s[1].y;
      const x2 = s[2].x, y2 = s[2].y;

      const u0 = d[0].x, v0 = d[0].y;
      const u1 = d[1].x, v1 = d[1].y;
      const u2 = d[2].x, v2 = d[2].y;

      const delta = (x1 - x0) * (y2 - y0) - (x2 - x0) * (y1 - y0);
      if (Math.abs(delta) < 0.0001) {
        ctx.restore();
        return;
      }

      const deltaU1 = u1 - u0, deltaU2 = u2 - u0;
      const deltaV1 = v1 - v0, deltaV2 = v2 - v0;

      const a = (deltaU1 * (y2 - y0) - deltaU2 * (y1 - y0)) / delta;
      const b = (deltaV1 * (y2 - y0) - deltaV2 * (y1 - y0)) / delta;
      const c = (deltaU2 * (x1 - x0) - deltaU1 * (x2 - x0)) / delta;
      const dVal = (deltaV2 * (x1 - x0) - deltaV1 * (x2 - x0)) / delta;
      const e = u0 - a * x0 - c * y0;
      const f = v0 - b * x0 - dVal * y0;

      ctx.transform(a, b, c, dVal, e, f);
      ctx.drawImage(img, 0, 0);
      ctx.restore();
    }

            generateMorePosts();
            renderApp();
          }
        };
      } else if (currentStep === 'profile') {
        // --- SVGサークルテキスト（卵形は固定、文字のみがまわる）のJS制御 ---
        const svg = document.getElementById('profile-orbit-svg');
        const textPath = document.getElementById('orbit-text-path');
        if (svg && textPath) {
          const svgW = svg.clientWidth || 350;
          const svgH = svg.clientHeight || 350;
          const cx = svgW / 2;
          const cy = svgH / 2;

          // 縦長卵型の楕円軌道 (rx=105, ry=155) - 少し上にシフト (cy - 35)
          const rx = svgW * 0.32;
          const ry = svgH * 0.44;
          const shiftY = cy - 35;
          const outerPath = document.getElementById('orbit-outer');
          if (outerPath) {
            outerPath.setAttribute('d',
              `M ${cx - rx},${shiftY} a ${rx},${ry} 0 1,1 ${rx*2},0 a ${rx},${ry} 0 1,1 -${rx*2},0`
            );
          }

          // 文字がまわるアニメーション (startOffset をスライドさせる)
          let textOffset = 0;
          const animateTextFlow = () => {
            if (!document.getElementById('profile-orbit-svg')) return; // ページ遷移で停止
            textOffset = (textOffset + 0.35) % 100;
            textPath.setAttribute('startOffset', `${textOffset}%`);
            requestAnimationFrame(animateTextFlow);
          };
          requestAnimationFrame(animateTextFlow);
        }
      }
    }

    // --- 本格🔥絵文字の全画面ダイナミック火炎物理シミュレーション (3秒間持続・ゆらゆら直進上昇) ---
    function triggerRealFireBurnSimulation(onComplete) {
      const canvas = document.getElementById('real-fire-canvas');
      if (!canvas) {
        onComplete();
        return;
      }

      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const ctx = canvas.getContext('2d');

      soundEngine.playSoftBurn();
      canvas.classList.add('active');

      let particles = [];
      const particleCount = 85;

      for (let i = 0; i < particleCount; i++) {
        particles.push({
          startX: Math.random() * canvas.width,
          x: Math.random() * canvas.width,
          y: canvas.height + Math.random() * 200,
          vy: -(Math.random() * 6 + 4),
          size: Math.floor(Math.random() * 45 + 20),
          rotation: (Math.random() - 0.5) * 0.3,
          rotSpeed: (Math.random() - 0.5) * 0.03,
          opacity: Math.random() * 0.5 + 0.5,
          swayFreq: Math.random() * 0.006 + 0.003,
          swayAmp: Math.random() * 18 + 8
        });
      }

      let animId;
      let startTime = performance.now();

      function loop(now) {
        const elapsed = (now - startTime) / 1000;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 背景の半透明暗転
        ctx.fillStyle = 'rgba(0, 0, 0, 0.22)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        particles.forEach(p => {
          // 左右に優しくゆらゆら揺れながら、まっすぐ上空へ立ち上る（斜め傾きなし）
          p.x = p.startX + Math.sin(now * p.swayFreq + p.y * 0.005) * p.swayAmp;
          p.y += p.vy;

          // 画面外に抜けたら下部からループ再生（3秒間途切れず燃え続ける）
          if (p.y < -80 && elapsed < 2.5) {
            p.y = canvas.height + Math.random() * 60;
            p.startX = Math.random() * canvas.width;
          }

          if (p.y > -100) {
            ctx.save();
            ctx.globalAlpha = Math.max(0, Math.min(1, p.opacity));
            ctx.translate(p.x, p.y);
            ctx.font = `${p.size}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🔥', 0, 0);
            ctx.restore();
          }
        });

        if (elapsed < 3.0) {
          animId = requestAnimationFrame(loop);
        }
      }

      animId = requestAnimationFrame(loop);

      setTimeout(() => {
        onComplete();
        setTimeout(() => {
          cancelAnimationFrame(animId);
          canvas.classList.remove('active');
        }, 300);
      }, 2700);
    }

      // 顔バリエーション切り替え処理ヘルパー
      const switchFaceOption = (targetIdx) => {
        soundEngine.playSubtleClick();
        selectedFaceOption = (targetIdx + 5) % 5;

        if (selectedFaceOption === 4) {
          // 5個目（自分の顔）選択時にカメラ許可を請求
          initCameraCapture(() => {
            renderApp();
          });
        } else {
          fallbackUserFaceImg = presetFaceTextures[selectedFaceOption];

        }
      };

      const prevArrow = document.getElementById('face-prev-arrow');
      if (prevArrow) {
        prevArrow.onclick = () => switchFaceOption(selectedFaceOption - 1);
      }

      const nextArrow = document.getElementById('face-next-arrow');
      if (nextArrow) {
        nextArrow.onclick = () => switchFaceOption(selectedFaceOption + 1);
      }

      const faceCanvas = document.getElementById('vibe-face-canvas');
      if (faceCanvas && currentStep === 'vibe_check') {
        // 現在の顔テクスチャを取得するヘルパー
        const getActiveFace = () => {
          return (selectedFaceOption === 4 && capturedPhotoImg) ? capturedPhotoImg : presetFaceTextures[selectedFaceOption % 4];
        };

        // 初期状態で変形ポイント配列を用意（まんまる球体）
        if (!faceCanvas._deformPoints) {
          faceCanvas._deformPoints = [];
        }

        let isDragging = false;
        let lastPointerX = 0;
        let lastPointerY = 0;

        // 2Dスクリーン座標 → 3D球体表面座標への近似変換
        // ※ Three.js の球体は rotation.y = -PI/2 でテクスチャが -90 度回転している
        // screenTo3D は表示上の x 座標をそのまま使い、右側でも正しく当たり判定するため
        // スクリーン座標系をキャンバス内比率で完全に計算する
        const screenTo3D = (clientX, clientY) => {
          const rect = faceCanvas.getBoundingClientRect();
          // キャンバス中心からの正規化オフセット (-1 ~ +1)
          const nx = ((clientX - rect.left) / rect.width) * 2 - 1;
          const ny = -(((clientY - rect.top) / rect.height) * 2 - 1);

          // 表示されている球体のスクリーン半径比（Three.js FOV 45°, z=3.6, 半径1.2 から計算）
          const sphereScreenRadius = 0.58;
          const sx = nx / sphereScreenRadius;
          const sy = ny / sphereScreenRadius;
          const r2 = sx * sx + sy * sy;

          if (r2 > 1.02) return null; // 球体外（少し余裕を持たせる）
          const rClamped = Math.min(r2, 1.0);
          const sz = Math.sqrt(1.0 - rClamped);
          return {
            x3d: sx * 1.2,
            y3d: sy * 1.2,
            z3d: sz * 1.2
          };
        };

        faceCanvas.onpointerdown = (e) => {
          e.preventDefault();
          isDragging = true;
          lastPointerX = e.clientX;
          lastPointerY = e.clientY;
          faceCanvas.setPointerCapture(e.pointerId);
          // タップ時に球体が消えないよう、即座に再描画
          drawPolaApexMeshDistortedFace(faceCanvas, vibes, true, getActiveFace());
        };

        faceCanvas.onpointermove = (e) => {
          if (!isDragging) return;
          e.preventDefault();

          const hit = screenTo3D(lastPointerX, lastPointerY);
          if (!hit) {
            lastPointerX = e.clientX;
            lastPointerY = e.clientY;
            return;
          }

          // ドラッグ方向の差分を3D空間の変位に変換（劇的・トゲトゲしい変形のため倍率UP）
          const rect = faceCanvas.getBoundingClientRect();
          const ddx = (e.clientX - lastPointerX) / rect.width * 4.0;
          const ddy = -(e.clientY - lastPointerY) / rect.height * 4.0;
          const dragMag = Math.sqrt(ddx * ddx + ddy * ddy);

          if (dragMag > 0.005) {
            // 法線方向の引っ張り量（ドラッグ距離に比例してトゲが伸びる）
            const normalPull = dragMag * 0.8;

            // 近隣の既存変形ポイントがあれば差分蓄積
            let merged = false;
            for (const dp of faceCanvas._deformPoints) {
              const d = Math.sqrt(
                (dp.x3d - hit.x3d) ** 2 + (dp.y3d - hit.y3d) ** 2 + (dp.z3d - hit.z3d) ** 2
              );
              if (d < 0.15) {
                dp.dx += ddx * 0.7;
                dp.dy += ddy * 0.7;
                dp.normalPull = (dp.normalPull || 0) + normalPull * 0.5;
                merged = true;
                break;
              }
            }

            if (!merged) {
              faceCanvas._deformPoints.push({
                x3d: hit.x3d,
                y3d: hit.y3d,
                z3d: hit.z3d,
                dx: ddx * 0.7,
                dy: ddy * 0.7,
                dz: 0,
                normalPull: normalPull,
                sigma: 0.22
              });
            }

            // 変形ポイント数の上限
            if (faceCanvas._deformPoints.length > 60) {
              faceCanvas._deformPoints = faceCanvas._deformPoints.slice(-45);
            }

            drawPolaApexMeshDistortedFace(faceCanvas, vibes, true, getActiveFace());
          }

          lastPointerX = e.clientX;
          lastPointerY = e.clientY;
        };

        faceCanvas.onpointerup = (e) => {
          isDragging = false;
          try { faceCanvas.releasePointerCapture(e.pointerId); } catch(err) {}
        };
      }

    // モバイルブラウザでのピンチズーム・ダブルタップ拡大防止

    document.addEventListener('touchend', function(e) {

        e.preventDefault();
      }
      lastTouchEnd = now;

    // 共有リアルタイムデータベース (KVDB.ioを用いたサーバーレス型匿名データ共有)
    const KVDB_URL = 'https://kvdb.io/4y9W8p9H2M9Q2S9X2Z2A2B/otakiage_posts_v2';

    async function syncPushToCloudDatabase(singlePostOrUpdatedPost) {
      try {
        const localList = [...posts];
        const cleanList = localList.map(p => ({
          id: p.id,
          userName: p.userName,
          userId: p.userId,
          dateStr: p.dateStr,
          text: p.text,
          authorVibe: p.authorVibe,
          customPhotoData: p.customPhotoData || '',
          gasshoCount: p.gasshoCount || 0,
          tag: p.tag,
          replies: p.replies || []
        }));

        await fetch(KVDB_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(cleanList)
        });
      } catch (err) {
        console.warn('Realtime database push error:', err);
      }
    }

    async function fetchFromCloudDatabase() {
      try {
        const res = await fetch(KVDB_URL);
        if (res.ok) {
          const cloudPosts = await res.json();
          if (Array.isArray(cloudPosts) && cloudPosts.length > 0) {
            cloudPosts.forEach(cp => {
              const exists = posts.some(p => p.id === cp.id);
              if (!exists) {
                posts.unshift(cp);
              } else {
                const target = posts.find(p => p.id === cp.id);
                if (target && cp.replies && cp.replies.length > (target.replies || []).length) {
                  target.replies = cp.replies;
                }
              }
            });
            posts = posts.filter((p, index, self) =>
              index === self.findIndex((t) => t.id === p.id)
            );
            return true;
          }
        }
      } catch (err) {
        console.warn('Realtime database fetch error:', err);
      }
      return false;
    }

    window.onload = async function() {
      renderApp();

      // 初回ロード時にクラウド上の共有データを読み込む
      await fetchFromCloudDatabase();
      renderApp();

      // リアルタイムデータベースとのクラウド自動同期周期 (5秒ごと)
      setInterval(async () => {
        const updated = await fetchFromCloudDatabase();
        if (updated && currentStep === 'chaos_gallery' && !selectedPostModal) {
          renderApp();
        }
      }, 5000);

      // 他のユーザーが打ち込んだお焚き上げもリアルタイムで更新されるようにするスケジューラー (8秒ごと)
      setInterval(() => {

        const tag1 = tags[Math.floor(Math.random() * tags.length)];
        const u = viralUserNames[Math.floor(Math.random() * viralUserNames.length)];
        
        const newPost = {
          id: `post-gen-realtime-${Date.now()}`,

          dateStr: 'たった今',

          authorVibe: {
            anger: Math.floor(Math.random() * 80 + 20),
            sadness: Math.floor(Math.random() * 80 + 20),
            unfairness: Math.floor(Math.random() * 80 + 20),
            envy: Math.floor(Math.random() * 80 + 20),
            void: Math.floor(Math.random() * 80 + 20)
          },
          gasshoCount: Math.floor(Math.random() * 5 + 1),
          tag: tag1,
          replies: generateContextualSympatheticEnjoReplies(sampleText)
        };
        
        posts.unshift(newPost);
        postIndexCount++;

        // 掲示板画面を表示中の場合のみ、画面のタイムライン表示を即座に再レンダリングする
        if (currentStep === 'chaos_gallery' && !selectedPostModal) {
          renderApp();
        }
      }, 8000);
    };
